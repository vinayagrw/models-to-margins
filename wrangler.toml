name = "models-to-margins"
main = "worker.js"
compatibility_date = "2024-11-01"

# This project deploys as a Cloudflare *Worker* with Static Assets (served on
# *.workers.dev), NOT as Cloudflare Pages. `worker.js` handles /api/* and falls
# through to the ASSETS binding for the static Astro build in dist/.
[assets]
directory = "./dist"
binding = "ASSETS"

# KV namespace for analytics events. Bound to the dedicated
# "models-to-margins-analytics" namespace so events persist across requests and
# isolates. If this binding is ever removed, storage.js degrades gracefully to an
# in-memory store (non-persistent) rather than failing the deploy.
[[kv_namespaces]]
binding = "ANALYTICS"
id = "f7268c2dda2c4c92aed8c35c4e65f4b0"
