name = "models-to-margins"
main = "worker.js"
compatibility_date = "2024-11-01"

# This project deploys as a Cloudflare *Worker* with Static Assets (served on
# *.workers.dev), NOT as Cloudflare Pages. `worker.js` handles /api/* and falls
# through to the ASSETS binding for the static Astro build in dist/.
[assets]
directory = "./dist"
binding = "ASSETS"

# KV namespace for analytics events. Left disabled so `wrangler deploy` succeeds
# out of the box: when ANALYTICS is unbound, storage.js degrades to an in-memory
# store (events do NOT persist across requests/isolates). To enable persistent
# analytics:
#   1. Find the existing namespace:  npx wrangler kv namespace list
#      (or create a new one:         npx wrangler kv namespace create ANALYTICS)
#   2. Paste its id below and uncomment this block, then redeploy.
# [[kv_namespaces]]
# binding = "ANALYTICS"
# id = "<your-real-kv-namespace-id>"
