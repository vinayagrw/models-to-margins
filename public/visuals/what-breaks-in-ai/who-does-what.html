<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Who does what</title>
<script src="./_theme-bootstrap.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="./_theme.css">
<style>
.dhead{display:flex;gap:14px;align-items:center}
.dhead h2{font-size:26px;line-height:1.15}
.dhead h2:focus{outline:none}
.btn{min-height:44px;padding:8px 14px;border-radius:10px;border:1.5px solid var(--rule);background:var(--bg);font-weight:600;cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.btn[aria-pressed="true"]{background:var(--accent-2);border-color:var(--accent-2);color:var(--surface)}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:18px;display:grid;gap:16px}
.lead{font-size:17px;line-height:1.5;text-wrap:balance}
.arch{border-top:1px dashed var(--rule);padding-top:14px;display:grid;gap:12px}
.arch h3{font:600 14px/1.2 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--accent-2)}
.arch h4{font:600 14px/1.3 var(--font);color:var(--muted);margin:0 0 6px;text-wrap:balance}
.arch ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.arch li{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr) auto;gap:4px 12px;align-items:start}
.arch li b{font-weight:600}
.arch li span{text-wrap:pretty}
.parts{display:flex;flex-wrap:wrap;gap:8px}
.parts span{font-size:14px;background:var(--bg);border:1px solid var(--rule);border-radius:999px;padding:6px 10px}
.std{font-size:15px;color:var(--muted);text-wrap:pretty}
@media (max-width:560px){.arch li{grid-template-columns:1fr}.dhead h2{font-size:22px}}

.grid{display:grid;grid-template-columns:190px repeat(5,minmax(0,1fr));gap:6px}
.grid .ch{font:600 14px/1.2 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--accent-2);text-align:center;padding:6px 0}
.grid .rh{font-weight:600;line-height:1.25;align-self:center;text-wrap:balance;padding-right:6px}
.cell{min-height:64px;border-radius:10px;border:1px dashed var(--rule)}
button.cell{border:1.5px solid var(--rule);background:var(--surface);text-align:left;padding:8px 10px;cursor:pointer;display:grid;gap:4px;align-content:start;min-width:0}
button.cell:hover{border-color:var(--accent)}
button.cell b{font-weight:600;font-size:15px;line-height:1.25;text-wrap:balance}
button.cell span{font:500 14px/1.2 var(--mono);color:var(--muted)}
button.cell.sel{outline:3px solid var(--accent-2);outline-offset:1px}
.phone{display:none}
.stages{display:flex;flex-wrap:wrap;gap:8px}
.plist{display:grid;gap:8px;margin-top:12px}
.plist .pr{display:grid;gap:6px}
.plist .pr>b{font-weight:600}
.plist .none{font-size:15px;color:var(--muted);border:1px dashed var(--rule);border-radius:10px;padding:10px 12px}
@media (max-width:820px){.grid{display:none}.phone{display:block}}
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true"><defs>
<linearGradient id="g-top" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></linearGradient>
<linearGradient id="g-left" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity=".1"/></linearGradient>
<linearGradient id="g-right" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".05"/><stop offset="1" stop-color="#000" stop-opacity=".35"/></linearGradient>
<radialGradient id="g-shadow"><stop offset="0" stop-color="#000" stop-opacity=".35"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
<mask id="m-top" maskContentUnits="userSpaceOnUse"><rect x="16" y="14" width="88" height="52" fill="url(#g-top)"/></mask>
<linearGradient id="g-shine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient>
</defs></svg><main class="shell" id="lanes">
  <div class="grid" role="table" aria-label="Who does what at each stage"><span></span><span class="ch" role="columnheader">Buy</span><span class="ch" role="columnheader">Pilot</span><span class="ch" role="columnheader">Go live</span><span class="ch" role="columnheader">Run</span><span class="ch" role="columnheader">Change</span><span class="rh" role="rowheader">Leadership</span><button class="cell" data-cell="0-0"><b>Set policy, name owners</b><span>once</span></button><button class="cell" data-cell="0-1"><b>Go or stop gate</b><span>once</span></button><button class="cell" data-cell="0-2"><b>Sign off residual risk</b><span>once</span></button><button class="cell" data-cell="0-3"><b>Continue, fix or stop</b><span>quarterly</span></button><button class="cell" data-cell="0-4"><b>Approve the change</b><span>per change</span></button><span class="rh" role="rowheader">Procurement and legal</span><button class="cell" data-cell="1-0"><b>Write contract terms</b><span>once</span></button><button class="cell" data-cell="1-1"><b>Collect vendor papers</b><span>once</span></button><button class="cell" data-cell="1-2"><b>Labels and assessments</b><span>once</span></button><button class="cell" data-cell="1-3"><b>Review vendor and terms</b><span>quarterly</span></button><button class="cell" data-cell="1-4"><b>Act on the notice</b><span>per change</span></button><span class="rh" role="rowheader">Security</span><button class="cell" data-cell="2-0"><b>Assess the supplier</b><span>once</span></button><button class="cell" data-cell="2-1"><b>Test for injection</b><span>once</span></button><button class="cell" data-cell="2-2"><b>Drill the off switch</b><span>once</span></button><button class="cell" data-cell="2-3"><b>Watch logs, report</b><span>weekly</span></button><button class="cell" data-cell="2-4"><b>Re-test the fence</b><span>per change</span></button><span class="rh" role="rowheader">Platform and architecture</span><button class="cell" data-cell="3-0"><b>Build your test set</b><span>once</span></button><button class="cell" data-cell="3-1"><b>Run tests, start log</b><span>weekly</span></button><button class="cell" data-cell="3-2"><b>Pin the model version</b><span>once</span></button><button class="cell" data-cell="3-3"><b>Run tests, watch drift</b><span>weekly</span></button><button class="cell" data-cell="3-4"><b>Test, then switch</b><span>per change</span></button><span class="rh" role="rowheader">Finance</span><button class="cell" data-cell="4-0"><b>Stop rule and cap</b><span>once</span></button><button class="cell" data-cell="4-1"><b>Track unit cost</b><span>weekly</span></button><button class="cell" data-cell="4-2"><b>Caps and spend alerts</b><span>once</span></button><button class="cell" data-cell="4-3"><b>Update value ledger</b><span>monthly</span></button><button class="cell" data-cell="4-4"><b>Re-price the case</b><span>per change</span></button><span class="rh" role="rowheader">Team heads and HR</span><button class="cell" data-cell="5-0"><b>Name checkers, plan training</b><span>once</span></button><button class="cell" data-cell="5-1"><b>Train and time checkers</b><span>weekly</span></button><button class="cell" data-cell="5-2"><b>Size the checker roster</b><span>once</span></button><button class="cell" data-cell="5-3"><b>Sample and measure</b><span>monthly</span></button><button class="cell" data-cell="5-4"><b>Tell users, retrain</b><span>per change</span></button></div>
  <div class="phone"><div class="stages" role="group" aria-label="Stage"><button class="btn" data-stage="0" aria-pressed="true">Buy</button><button class="btn" data-stage="1" aria-pressed="false">Pilot</button><button class="btn" data-stage="2" aria-pressed="false">Go live</button><button class="btn" data-stage="3" aria-pressed="false">Run</button><button class="btn" data-stage="4" aria-pressed="false">Change</button></div><div class="plist" id="plist"></div></div>
  <article class="panel" id="cdet" hidden></article>
</main>

<script>
/* Report content height so the host .visual-frame hugs the visual. */
(() => {
  const main = document.querySelector('main');
  const post = () => {
    if (document.documentElement.dataset.embedded !== 'true') return;
    window.parent.postMessage({ type: 'm2m:frame-size', height: Math.ceil(main.getBoundingClientRect().height) }, '*');
  };
  new ResizeObserver(post).observe(main);
  window.addEventListener('load', post);
  if (document.fonts) document.fonts.ready.then(post);
  window.m2mPostSize = post;
})();
</script>
<script>
function showInHost(el){
  const fe=window.frameElement; if(!fe) return;
  setTimeout(()=>{
    const top=fe.getBoundingClientRect().top+el.getBoundingClientRect().top;
    if(top<90||top>window.parent.innerHeight-80) window.parent.scrollTo({top:window.parent.scrollY+top-120});
  },80);
}
function setHash(v){try{history.replaceState(null,"",v?"#"+v:location.pathname+location.search)}catch(e){}}
const icon=(id,size,cls)=>`<svg class="ic ${cls||""}" width="${size}" height="${size}" aria-hidden="true"><use href="#${id}"/></svg>`;
const EVT={"verified": "verified 2026", "vendor": "vendor", "illustrative": "illustrative"};
const evChip=e=>e?`<span class="ev ${e}">${EVT[e]}</span>`:"";
function optList(opts){
  if(!opts||!opts.length) return "";
  return `<div class="opts"><h4>Named options, examples not a ranking</h4><ul>${opts.map(o=>`<li><b>${o.name}</b><span>${o.what}</span>${evChip(o.ev)}</li>`).join("")}</ul></div>`;
}

const L={"rows": ["Leadership", "Procurement and legal", "Security", "Platform and architecture", "Finance", "Team heads and HR"], "cols": ["Buy", "Pilot", "Go live", "Run", "Change"], "cells": [{"r": 0, "c": 0, "task": "Set policy, name owners", "detail": "Set the AI policy and risk tolerance. Name one owner per building block and pick one approved tool.", "cad": "once", "std": "NIST AI RMF GOVERN 2.3 and 1.3. ISO 42001 clauses 5.1, 5.2 and 6.1.2", "ev": "verified"}, {"r": 1, "c": 0, "task": "Write contract terms", "detail": "Put the change terms into the contract: no training on your data, your right to test, notice of changes, incident notice, data handover in a common format, an audit right and an exit plan.", "cad": "once", "std": "NIST AI 600-1 GV-6.1 and GV-6.2-007. EU model clauses for AI, sections D and E. US OMB M-25-22 section 4.d.iii", "ev": "verified"}, {"r": 2, "c": 0, "task": "Assess the supplier", "detail": "Assess the supplier, list every third party that can see your content, keep an approved provider list and threat-model the use case.", "cad": "once", "std": "NIST AI 600-1 GV-6.1-007 and GV-3.2-005", "ev": "verified"}, {"r": 3, "c": 0, "task": "Build your test set", "detail": "Write down the intended purpose and build your own test set from data the vendor cannot see and that looks like live data.", "cad": "once", "std": "NIST AI RMF MAP 1.1 and MEASURE 2.3. US OMB M-25-22 section 4.d.iii.E", "ev": "verified"}, {"r": 4, "c": 0, "task": "Stop rule and cap", "detail": "Write the business case with costs, including the cost of AI errors. Set the stop rule and the budget cap before any pilot starts.", "cad": "once", "std": "NIST AI RMF MAP 3.1 and 3.2. FinOps cost tracking and quotas. US OMB M-25-22 section 4.e.iv", "ev": "verified"}, {"r": 5, "c": 0, "task": "Name checkers, plan training", "detail": "Name the use case and who checks its output. Plan AI literacy training for every user.", "cad": "once", "std": "EU AI Act Article 4. NIST AI RMF MAP 3.4 and GOVERN 2.2. ISO 42001 clause 7.2", "ev": "verified"}, {"r": 0, "c": 1, "task": "Go or stop gate", "detail": "Hold the go or stop decision at the end of the pilot, judged against the stop rule set at Buy.", "cad": "once", "std": "NIST AI RMF MANAGE 1.1", "ev": "verified"}, {"r": 1, "c": 1, "task": "Collect vendor papers", "detail": "Collect the acceptable use policy, model or system card, user guides and feedback channel from the vendor.", "cad": "once", "std": "US OMB M-26-04 appendix A. EU general-purpose AI code, transparency chapter", "ev": "verified"}, {"r": 2, "c": 1, "task": "Test for injection", "detail": "Test the pilot set-up for prompt injection and data leaks, and switch logging on.", "cad": "once", "std": "NIST AI 600-1 GV-3.2-005. NIST AI RMF GOVERN 4.3", "ev": "verified"}, {"r": 3, "c": 1, "task": "Run tests, start log", "detail": "Run the test set, plant known errors to measure how many the checks catch, and start the failure log.", "cad": "weekly", "std": "NIST AI RMF MEASURE 2.3. NIST AI 600-1 MS-2.5-003 and MG-4.3-002", "ev": "verified"}, {"r": 4, "c": 1, "task": "Track unit cost", "detail": "Track cost per call or per case and one value measure, and compare both with the stop rule.", "cad": "weekly", "std": "FinOps unit costs. NIST AI RMF MAP 3.1 and 3.2", "ev": "verified"}, {"r": 5, "c": 1, "task": "Train and time checkers", "detail": "Train the named checkers, time each review and collect user feedback.", "cad": "weekly", "std": "NIST AI 600-1 GV-3.2-004 and MP-3.4-005. EU AI Act Article 26(2) for high-risk use", "ev": "verified"}, {"r": 0, "c": 2, "task": "Sign off residual risk", "detail": "Sign off the remaining risk, the named owners and a plan to switch the tool off.", "cad": "once", "std": "NIST AI RMF GOVERN 2.3 and 1.7. ISO 42001 clause 9.3", "ev": "verified"}, {"r": 1, "c": 2, "task": "Labels and assessments", "detail": "Label AI text and deepfakes published on public-interest matters. For high-risk use, add the impact assessments and tell affected people.", "cad": "once", "std": "EU AI Act Articles 26, 27 and 50(4)", "ev": "verified"}, {"r": 2, "c": 2, "task": "Drill the off switch", "detail": "Test the off switch, agree an incident plan with the vendor and keep logs for at least six months for high-risk use.", "cad": "once", "std": "NIST AI 600-1 GV-1.7-001. EU AI Act Article 26(6)", "ev": "verified"}, {"r": 3, "c": 2, "task": "Pin the model version", "detail": "Pin the model version behind the gateway and add the system to the AI inventory with its version, owners and known issues.", "cad": "once", "std": "NIST AI 600-1 GV-1.6-001 and GV-1.6-003", "ev": "verified"}, {"r": 4, "c": 2, "task": "Caps and spend alerts", "detail": "Set spending caps, alerts and cost tags per team and project.", "cad": "once", "std": "FinOps tags, quotas and alerts", "ev": "verified"}, {"r": 5, "c": 2, "task": "Size the checker roster", "detail": "Put the checker roster in place, sized to the volume of AI output, with training done.", "cad": "once", "std": "EU AI Act Articles 4 and 26(7). ISO 42001 clauses 7.2 and 7.3", "ev": "verified"}, {"r": 0, "c": 3, "task": "Continue, fix or stop", "detail": "Review the value ledger, failure log and incidents, then decide to continue, fix or stop.", "cad": "quarterly", "std": "NIST AI RMF GOVERN 1.5. ISO 42001 clause 9.3. US OMB M-25-22 section 4.d.iii.E", "ev": "verified"}, {"r": 1, "c": 3, "task": "Review vendor and terms", "detail": "Review vendor performance and terms, watch for retirement notices and use the audit right.", "cad": "quarterly", "std": "NIST AI RMF MANAGE 3.1. EU model clauses for AI, article 20 (yearly audit)", "ev": "verified"}, {"r": 2, "c": 3, "task": "Watch logs, report", "detail": "Watch logs and incidents. Report a serious incident to the provider and the authority within the legal clock: 15 days, 10 for a death, 2 for a widespread breach or critical infrastructure.", "cad": "weekly", "std": "NIST AI 600-1 MG-4.3-003. EU AI Act Articles 26(5) and 73", "ev": "verified"}, {"r": 3, "c": 3, "task": "Run tests, watch drift", "detail": "Run the test set, watch for drift and made-up content, and keep the failure log current.", "cad": "weekly", "std": "NIST AI 600-1 MG-4.1-002, MG-4.3-002 and MS-2.5-003", "ev": "verified"}, {"r": 4, "c": 3, "task": "Update value ledger", "detail": "Update cost per unit and value per use case, look for anomalies and apply the stop rules.", "cad": "monthly", "std": "FinOps anomaly detection. NIST AI RMF MAP 3.2", "ev": "verified"}, {"r": 5, "c": 3, "task": "Sample and measure", "detail": "Sample approved output, track the checkers' catch rate and review backlog, and refresh training.", "cad": "monthly", "std": "NIST AI 600-1 MP-3.4-005. NIST AI RMF MEASURE 3.3. EU AI Act Article 4", "ev": "verified"}, {"r": 0, "c": 4, "task": "Approve the change", "detail": "Approve a material change, a switch of vendor or a retirement.", "cad": "per change", "std": "NIST AI RMF MANAGE 2.4 and GOVERN 1.7", "ev": "verified"}, {"r": 1, "c": 4, "task": "Act on the notice", "detail": "Act on the vendor notice. At exit, get your data back in a common format with proof of deletion.", "cad": "per change", "std": "US OMB M-25-22 sections 4.d.iii.G and 4.f.i. EU model clauses for AI, articles 15 to 17", "ev": "verified"}, {"r": 2, "c": 4, "task": "Re-test the fence", "detail": "Re-test the changed model and its fallback, and update the threat model.", "cad": "per change", "std": "NIST AI 600-1 GV-6.2-006 and GV-3.2-005", "ev": "verified"}, {"r": 3, "c": 4, "task": "Test, then switch", "detail": "Run the full test set before switching and roll back if the new version scores below the bar.", "cad": "per change", "std": "US OMB M-25-22 section 4.d.iii.F. NIST AI RMF MANAGE 4.1. ISO 42001 clause 10.2", "ev": "verified"}, {"r": 4, "c": 4, "task": "Re-price the case", "detail": "Re-price the business case and re-check the stop rule.", "cad": "per change", "std": "US OMB M-25-22 section 4.e.iv. NIST AI RMF MAP 3.2", "ev": "verified"}, {"r": 5, "c": 4, "task": "Tell users, retrain", "detail": "Tell users what changed, retrain the checkers and adjust review capacity.", "cad": "per change", "std": "NIST AI 600-1 MG-2.4-001 for retirement or switch-off. EU AI Act Article 4", "ev": "verified"}]};
const $=q=>document.querySelector(q);
const C={};L.cells.forEach(c=>C[c.r+"-"+c.c]=c);
function stage(i){
  document.querySelectorAll("[data-stage]").forEach(b=>b.setAttribute("aria-pressed",String(+b.dataset.stage===i)));
  $("#plist").innerHTML=L.rows.map((rn,r)=>{const c=C[r+"-"+i];return `<div class="pr"><b>${rn}</b>${c?`<button class="cell" data-cell="${r}-${i}"><b>${c.task}</b><span>${c.cad}</span></button>`:`<span class="none">No task at this stage</span>`}</div>`}).join("");
  if(window.m2mPostSize)window.m2mPostSize();
}
function openC(key,focus){
  const c=C[key];if(!c)return;
  document.querySelectorAll("button.cell").forEach(b=>b.classList.toggle("sel",b.dataset.cell===key));
  $("#cdet").innerHTML=`<div class="dhead"><div><div class="tag">${L.rows[c.r]} · ${L.cols[c.c]} · ${c.cad}</div><h2 id="c-t" tabindex="-1">${c.task}</h2></div><button class="btn" id="c-x" style="margin-left:auto">Close</button></div>
  <p class="lead">${c.detail}</p>
  <div class="arch"><h3>Standard it meets</h3><p class="std">${c.std} ${evChip(c.ev)}</p></div>`;
  $("#cdet").hidden=false;$("#c-x").onclick=closeC;setHash("open="+key);
  if(window.m2mPostSize)window.m2mPostSize();
  if(focus){$("#c-t").focus({preventScroll:true});showInHost($("#cdet"));}
}
function closeC(){const sel=document.querySelector("button.cell.sel");$("#cdet").hidden=true;document.querySelectorAll("button.cell").forEach(b=>b.classList.remove("sel"));setHash(null);if(window.m2mPostSize)window.m2mPostSize();if(sel&&sel.offsetParent){sel.focus({preventScroll:true});showInHost(sel);}}
document.addEventListener("click",e=>{const s=e.target.closest("[data-stage]");if(s){stage(+s.dataset.stage);return;}const c=e.target.closest("[data-cell]");if(c)openC(c.dataset.cell,true);});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#cdet").hidden)closeC();});
const h=new URLSearchParams(location.hash.slice(1));
stage(h.get("stage")?+h.get("stage"):0);
if(h.get("open"))openC(h.get("open"),false);
</script>
</body>
</html>
