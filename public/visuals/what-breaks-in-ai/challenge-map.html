<title>Where AI breaks: the 24 problems</title>

<link rel="stylesheet" href="./_theme.css">
<style>
.legend{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.legend .tag{margin-left:auto}
.lanes{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:18px}
.lane{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:18px;display:grid;gap:14px;align-content:start;min-width:0}
.lane .sh{display:flex;gap:14px;align-items:center}
.lane h3{font-size:24px;line-height:1.15}
.lane .job{color:var(--muted);font-weight:500;margin-top:4px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.lane.f .tiles{grid-template-columns:repeat(3,minmax(0,1fr))}
.tile{display:flex;align-items:center;gap:10px;min-height:56px;text-align:left;border:1.5px solid var(--rule);background:var(--bg);border-radius:10px;padding:8px 10px;font-weight:600;font-size:15px;line-height:1.25;cursor:pointer;min-width:0;text-wrap:balance}
.tile:hover{border-color:var(--accent)}
.tile.w{border-color:var(--worse)}
.tile .k{font:500 14px/1 var(--mono);color:var(--muted);flex:none;min-width:28px}
.detail{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:18px;display:grid;gap:18px}
.dtop{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.dtop .navs{display:flex;gap:10px;margin-left:auto}
.btn{min-height:44px;padding:8px 14px;border-radius:10px;border:1.5px solid var(--rule);background:var(--bg);font-weight:600;cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.dgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:24px;align-items:start}
.dside{display:grid;gap:14px;align-content:start}
.dh{display:flex;gap:14px;align-items:center}
.dside h2{font-size:28px;line-height:1.15}
.dside h2:focus{outline:none}
.big{display:grid;gap:6px;background:var(--bg);border-radius:12px;padding:14px 16px}
.big b{font-size:34px;line-height:1.05;color:var(--accent)}
.big b.w{color:var(--worse)}
.big .src{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:4px}
.dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 22px;margin:0}
.dl div{min-width:0}
.dl dt{font:600 14px/1.2 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--accent-2)}
.dl dd{margin:4px 0 0;line-height:1.5;text-wrap:balance}
.dl dd.evd{display:grid;gap:8px;justify-items:start}
.dl .wide{grid-column:1/-1}
.evp{display:inline-block;font:600 14px/1.2 var(--font);padding:7px 11px;border-radius:999px}
.evp.m{background:var(--new-bg);color:var(--new)}
.evp.v{background:var(--true-bg);color:var(--true)}
.evp.n{background:var(--off);color:var(--muted)}
@media (max-width:900px){.lanes{grid-template-columns:1fr}.dgrid{grid-template-columns:1fr}}
@media (max-width:560px){.tiles,.lane.f .tiles{grid-template-columns:1fr}.dl{grid-template-columns:1fr}.legend .tag{margin-left:0}.dtop .navs{margin-left:0;width:100%}.dtop .navs .btn{flex:1}.dtop>.btn{width:100%}}
</style>
</head>

<script>
/* Report content height so the host .visual-frame hugs the visual. */
(() => {
  const main = document.querySelector('main');
  const post = () => {
    if (document.documentElement.dataset.embedded !== 'true') return;
    window.parent.postMessage({ type: 'm2m:frame-size', height: Math.ceil(main.getBoundingClientRect().height) }, '*');
  };
  new ResizeObserver(post).observe(main);
  window.addEventListener('load', post);
  if (document.fonts) document.fonts.ready.then(post);
  window.m2mPostSize = post;
})();
</script>

 first” to research prompts.", "eff": "Medium", "mat": "Research", "ev": "m", "evl": "A plain prompt gave the same gain as the full check", "b": ["P2", "P9"], "tier": ""}, {"id": "S9", "lane": "s", "name": "Memory beats search", "ic": "i-sql", "st": "true", "see": "An answer from training data when search was on, or a correct memory overwritten by a bad page.", "why": "The model's own confidence decides what to trust, and that confidence is poorly calibrated.", "num": "60%+", "numl": "of cases where models took wrong retrieved text over correct memory", "tag": "Peer-reviewed study, 2024", "evt": "verified", "fix": "Require a dated primary source for changing facts, with an expiry date.", "own": "Vendor and buyer", "first": "Require a dated primary source for prices, rules and office holders.", "eff": "Medium", "mat": "Research", "ev": "m", "evl": "Measured in lab tests only", "b": ["P1", "P2"], "tier": ""}, {"id": "S10", "lane": "s", "name": "Planted instructions", "ic": "i-security", "st": "true", "see": "Usually nothing. Hidden text on a page steers the answer or tells an agent to act.", "why": "One model reads data and instructions together and cannot reliably tell them apart.", "num": "73.1%", "numl": "of injected attacks on real pages got past a standard browsing planner", "tag": "Preprint, Oct 2026", "evt": "verified", "fix": "Keep page text away from any model that can act, and ask before actions that follow web content.", "own": "Vendor and buyer", "first": "Remove email, payment and file access from browsing agents, and turn on approvals.", "eff": "High", "mat": "Filters sold, isolation in research", "ev": "m", "evl": "Attacks got through 12.8% of the time, against 73.1% without", "b": ["P4"], "tier": ""}, {"id": "F1", "lane": "f", "name": "Confident wrong answers", "ic": "i-risk", "st": "true", "see": "A fluent answer with invented case law, a wrong figure or an unneeded medical test, and the error only shows up later in court or with a client.", "why": "The model sounds just as sure when it is wrong, and people often use the output without checking.", "num": "Over 2,200", "numl": "court cases now listed with AI-invented content", "tag": "Researcher's case database, Oct 2026", "evt": "verified", "fix": "A named person checks every citation and figure before anything is filed or sent. Record which model produced which output.", "own": "Team heads, with the CIO", "first": "Name one person per team who opens every cited source and figure before AI work leaves the company.", "eff": "Medium", "mat": "Generally available", "ev": "m", "evl": "Grounded legal tools were wrong less often. The human check is not measured", "b": ["P1", "P9", "P10"], "tier": "A"}, {"id": "F2", "lane": "f", "name": "Agents act wrongly", "ic": "i-agent", "st": "worse", "see": "An agent deletes files, touches production, uses saved passwords, or says tests pass when the last run came before its own edits.", "why": "Agents get broad permissions by default, and few teams can trace what an agent actually did.", "num": "80 of 357", "numl": "“tests pass” claims in one team's audit had no up-to-date test run behind them", "tag": "One user team, Oct 2026", "evt": "verified", "fix": "Give agents the least access they need and an approval step before delete or deploy. Accept a pass only with a captured test log.", "own": "Security lead and CIO", "first": "Turn sandboxes on by policy and give each agent its own low-privilege login.", "eff": "Medium", "mat": "Generally available, often off by default", "ev": "v", "evl": "Vendor's own test only", "b": ["P4", "P9"], "tier": "A"}, {"id": "F3", "lane": "f", "name": "Data leaves your control", "ic": "i-vault", "st": "true", "see": "Staff paste company data into personal AI accounts. Consumers learn from lawsuits that allege their chats were used without valid consent.", "why": "Policies alone do not stop it, and uploads were highest where AI was banned.", "num": "48%", "numl": "of employees who use AI uploaded company information to public AI tools", "tag": "University and KPMG survey, 2025", "evt": "verified", "fix": "Give staff an approved tool with controls that stop company data leaving, and check what each vendor may do with your chats.", "own": "CIO and security lead", "first": "Pick one approved AI tool with no-training terms and turn on data-loss controls.", "eff": "Medium", "mat": "Generally available, some parts in preview", "ev": "v", "evl": "Vendor survey, not cause and effect", "b": ["P5"], "tier": "A"}, {"id": "F4", "lane": "f", "name": "Agent tools attacked", "ic": "i-security", "st": "true", "see": "A hidden instruction in a repo, web page or plug-in makes a coding tool leak secrets or run code on a developer's machine.", "why": "Agent tools treat text they read as instructions, and some vendors decline to treat these chains as flaws.", "num": "8.8", "numl": "severity out of 10 for a Copilot flaw in Visual Studio triggered by a hidden instruction", "tag": "Security researcher, Oct 2026", "evt": "verified", "fix": "Treat repos, plug-ins and tool settings as untrusted, keep agents off the open internet by default, and patch agent tools quickly.", "own": "Security lead, with procurement", "first": "Allow only listed tool servers, and close agents' network access by default.", "eff": "Medium", "mat": "Mixed", "ev": "v", "evl": "Vendor's own test. Adaptive attacks beat most filters", "b": ["P4"], "tier": "B"}, {"id": "F5", "lane": "f", "name": "Spend without return", "ic": "i-kpi", "st": "true", "see": "AI budgets keep rising while finance teams still cannot see which uses pay back.", "why": "Few firms compare value with cost, and few set rules for stopping a pilot.", "num": "13%", "numl": "of CIOs report significant or transformational value from AI, in a survey of 2,002 tech leaders", "tag": "Analyst survey, May to Jul 2026", "evt": "verified", "fix": "Track value against cost for each use case, and write the stop rule before each pilot starts.", "own": "Finance lead", "first": "Write the value measure, cost measure and stop rule before the next pilot starts.", "eff": "Medium", "mat": "Meters sold, value standards early", "ev": "v", "evl": "Analyst survey, a link not proof", "b": ["P8"], "tier": "C"}, {"id": "F6", "lane": "f", "name": "Models change", "ic": "i-model", "st": "true", "see": "The model behaves differently after an update, an old model disappears, or an API model is retired and calls start failing.", "why": "Vendors replace models to free capacity, and default settings change too.", "num": "29", "numl": "OpenAI model IDs shut down in one day", "tag": "Vendor notice, Oct 2026", "evt": "vendor", "fix": "Pin model versions, keep a register of retirement dates and rerun your own tests before accepting any change.", "own": "Platform lead, with procurement", "first": "Pin the model version in every production use and keep a list of retirement dates.", "eff": "Low to medium", "mat": "Generally available", "ev": "m", "evl": "Model updates broke 24.7% to 47.2% of right answers in a lab test", "b": ["P6", "P7", "P10"], "tier": "B"}, {"id": "F7", "lane": "f", "name": "Surprise usage caps", "ic": "i-measure", "st": "new", "see": "A paid allowance runs out far faster than expected, and there is no way to tell in advance what a task will cost.", "why": "Vendors reprice and cut allowances often, compute is scarce, and meters are not documented.", "num": "33", "numl": "pricing and limit changes across AI tools in one quarter", "tag": "Community tracker, Q3 2026", "evt": "verified", "fix": "Write notice periods for limit changes into contracts, track usage per task and ask vendors for a cost preview.", "own": "Finance lead and procurement", "first": "Set hard spend caps per person, team and agent.", "eff": "Low", "mat": "Generally available", "ev": "n", "evl": "Not measured yet", "b": ["P6", "P7", "P8"], "tier": "C"}, {"id": "F8", "lane": "f", "name": "Tells you what you want", "ic": "i-approve", "st": "new", "see": "The assistant agrees, praises and goes along. Most people do not notice. Vulnerable users can be pulled deeper into harmful beliefs.", "why": "Models tend to go along with the person in front of them. Eight US states now allege the design itself is too agreeable.", "num": "8", "numl": "US states sued OpenAI on the same day over ChatGPT safety", "tag": "State filings, Oct 2026", "evt": "verified", "fix": "If you run a consumer chat product, add crisis routing, age checks and instructions against blind agreement. Test them on your own chats.", "own": "Mostly the vendor", "first": "Test your chatbot with anti-agreement instructions, and route crisis talk to people.", "eff": "High for vendors", "mat": "Partly available", "ev": "m", "evl": "Cut agreement with delusions by 73.8% in simulated chats", "b": ["P9", "P10"], "tier": "B"}, {"id": "F9", "lane": "f", "name": "Controls lag rollout", "ic": "i-policy-doc", "st": "new", "see": "Agents go live faster than anyone can list, trace or switch them off. Regulators have started asking vendors questions.", "why": "Rollout plans run ahead of governance. This month the EU AI Office sent its first information requests and the FTC sent subpoenas.", "num": "71% vs 21%", "numl": "of organisations plan AI agents within a year, against those with governance for them", "tag": "Analyst survey of 2,000+ tech leaders, Q2 2026", "evt": "verified", "fix": "Keep a list of every agent, with full traces and a kill switch you have tested.", "own": "CIO and security lead", "first": "List every agent in one register and rehearse switching one off.", "eff": "Medium", "mat": "Registers sold, standards early", "ev": "n", "evl": "Not measured yet", "b": ["P4", "P5"], "tier": "C"}, {"id": "F10", "lane": "f", "name": "Review overload", "ic": "i-pm", "st": "true", "see": "People spend more time checking AI output, maintainers face a flood of low-quality AI submissions, and some roles are being cut.", "why": "Output grows faster than review capacity, and rework eats the time AI saved.", "num": "25%", "numl": "of incoming code changes are low-quality AI work, say open-source maintainers", "tag": "Maintainer survey, Oct 2026", "evt": "verified", "fix": "Plan roles and review capacity around the volume AI produces, not the old workload.", "own": "Team heads and HR", "first": "Track changes per reviewer and cap incoming AI-written changes.", "eff": "High", "mat": "Tools sold, role design in research", "ev": "v", "evl": "Two studies disagree", "b": ["P8", "P9"], "tier": "C"}, {"id": "F11", "lane": "f", "name": "Loses context", "ic": "i-cache", "st": "true", "see": "The assistant forgets earlier decisions, ignores house rules or invents context it never had.", "why": "Long chats get compressed, sometimes to save cost when space remains, and rules in a prompt are advice the model can drop.", "num": "7 of about 20", "numl": "coding sessions lost working context overnight in one user's log", "tag": "User report, Oct 2026", "evt": "verified", "fix": "Keep key rules and decisions in files the tool reloads, and enforce house rules outside the model.", "own": "Platform lead", "first": "Put hard rules in tool settings, not in the prompt.", "eff": "Medium", "mat": "Generally available", "ev": "m", "evl": "A recap won back about half of a 34-point drop in a lab test", "b": ["P4"], "tier": "C"}, {"id": "F12", "lane": "f", "name": "Outages", "ic": "i-cloud", "st": "true", "see": "Errors and slowdowns in the middle of a task, sometimes while the status page says all is well.", "why": "Compute is tight, and a single fault can block every product a vendor runs at once.", "num": "~10,000", "numl": "outage reports for one Gemini outage while its status page showed no issue", "tag": "Outage tracker, Oct 2026", "evt": "verified", "fix": "Fail over across providers, and alert on spend-limit and capacity errors.", "own": "Platform lead and procurement", "first": "Route AI calls through a gateway with a tested fallback to a second provider.", "eff": "Medium", "mat": "Generally available", "ev": "n", "evl": "Not measured yet", "b": ["P6", "P7"], "tier": "C"}, {"id": "F13", "lane": "f", "name": "Misfiring safety filters", "ic": "i-denial", "st": "true", "see": "Normal work is refused or flagged, while some harmful requests still get through.", "why": "Filters trade false alarms against misses, so normal work gets caught along with real risks.", "num": "Over half", "numl": "of reasonable safety research tasks refused by three Anthropic models in a UK government test", "tag": "UK government test from last winter, reported Oct 2026", "evt": "verified", "fix": "Ask vendors for an appeal or allowlist path and their false-alarm rates.", "own": "Mostly the vendor", "first": "Test models on your own harmless but sensitive prompts before choosing filter levels.", "eff": "Medium", "mat": "Generally available", "ev": "v", "evl": "Vendor's own test only", "b": ["P6", "P10"], "tier": "C"}, {"id": "F14", "lane": "f", "name": "Vendor lock-in", "ic": "i-gateway", "st": "new", "see": "Moving a working AI tool to another provider takes far longer than planned, and price rises arrive that you cannot avoid.", "why": "Model names are hard-coded, prompts are tuned to one model, and business plans limit what you can export.", "num": "81%", "numl": "of 520 tech leaders say switching costs made them delay, scale back or rework a move", "tag": "Vendor survey, Sep 2026", "evt": "vendor", "fix": "Keep model names in settings behind a gateway, own your tests and prompts, and write exit terms into contracts.", "own": "CIO and procurement", "first": "At the next renewal, add export, notice and no-silent-renewal terms.", "eff": "Medium to high", "mat": "Gateways sold, export weak", "ev": "n", "evl": "Not measured yet", "b": ["P5", "P6", "P7"], "tier": "C"}];
const ST={worse:["worse","Harm rising"],new:["new","New events"],true:["true","Still true"]};
const EV={m:"Measured",v:"Vendor or survey only",n:"Not measured"};
const EVT={verified:"verified 2026",vendor:"vendor"};
const $=q=>document.querySelector(q);
const icon=(id,size,cls)=>`<svg class="ic ${cls}" width="${size}" height="${size}" aria-hidden="true"><use href="#${id}"/></svg>`;
const role=f=>f.st==="worse"?"iso-red":f.lane==="s"?"iso-violet":"iso-coral";
const W=f=>f.st==="worse"?"w":"";
const LANES=[["s","Web search","i-network","iso-violet","10 ways answers go wrong when AI searches the web."],["f","Wider AI use","i-executive","iso-amber","14 problems in daily use, in tiers. Tier A hurts most."]];
$("#lanes").innerHTML=LANES.map(l=>`<div class="lane ${l[0]}"><div class="sh">${icon(l[2],88,l[3])}<div><h3>${l[1]}</h3><p class="job">${l[4]}</p></div></div><div class="tiles">${I.filter(f=>f.lane===l[0]).map(f=>`<button class="tile ${W(f)}" data-open="${f.id}"><span class="k">${f.id}</span>${f.name}</button>`).join("")}</div></div>`).join("");
let cur=null,from=null;
/* Keep what the reader just asked for on screen. Runs after the host has resized the frame. */
function showInHost(el){
  const fe=window.frameElement; if(!fe) return;
  setTimeout(()=>{
    const top=fe.getBoundingClientRect().top+el.getBoundingClientRect().top;
    if(top<90||top>window.parent.innerHeight-80) window.parent.scrollTo({top:window.parent.scrollY+top-120});
  },80);
}
function setHash(v){try{history.replaceState(null,"",v?"#open="+v:location.pathname+location.search)}catch(e){}}
function openD(id,focus){
  const k=I.findIndex(f=>f.id===id); if(k<0) return; const f=I[k]; cur=k;
  $("#detail").innerHTML=`<div class="dtop"><button class="btn" id="d-back">‹ All 24 problems</button><div class="navs"><button class="btn" id="d-p" ${k===0?"disabled":""}>‹ Previous</button><button class="btn" id="d-n" ${k===I.length-1?"disabled":""}>Next ›</button></div></div>
  <div class="dgrid"><div class="dside"><div class="dh">${icon(f.ic,88,role(f))}<div class="tag">${f.id} · ${f.lane==="s"?"Web search":"Wider AI, tier "+f.tier}</div></div>
  <h2 id="d-title" tabindex="-1">${f.name}</h2><span class="pill ${ST[f.st][0]}" style="justify-self:start">${ST[f.st][1]}</span>
  <div class="big"><b class="${W(f)}">${f.num}</b><span>${f.numl}</span><span class="src"><span class="tag">${f.tag}</span><span class="ev ${f.evt}">${EVT[f.evt]}</span></span></div></div>
  <dl class="dl"><div><dt>What you see</dt><dd>${f.see}</dd></div><div><dt>Why it happens</dt><dd>${f.why}</dd></div><div class="wide"><dt>The fix</dt><dd>${f.fix}</dd></div><div><dt>Who owns it</dt><dd>${f.own}</dd></div><div><dt>First step</dt><dd>${f.first}</dd></div><div><dt>Effort and maturity</dt><dd>${f.eff} effort. ${f.mat}.</dd></div><div><dt>Does the fix work?</dt><dd class="evd"><span class="evp ${f.ev}">${EV[f.ev]}</span><span>${f.evl}.</span></dd></div></dl></div>`;
  $("#lanes").hidden=true; $("#detail").hidden=false; setHash(id);
  $("#d-back").onclick=closeD; $("#d-p").onclick=()=>openD(I[cur-1].id,true); $("#d-n").onclick=()=>openD(I[cur+1].id,true);
  if(window.m2mPostSize) window.m2mPostSize();
  if(focus){ $("#d-title").focus({preventScroll:true}); showInHost($("#detail")); }
}
function closeD(){
  const id=cur!==null?I[cur].id:null; cur=null;
  $("#detail").hidden=true; $("#lanes").hidden=false; setHash(null);
  if(window.m2mPostSize) window.m2mPostSize();
  const t=id&&document.querySelector(`[data-open="${id}"]`); if(t){ t.focus({preventScroll:true}); showInHost(t); }
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-open]");if(b) openD(b.dataset.open,true);});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&cur!==null) closeD();});
const h=new URLSearchParams(location.hash.slice(1));if(h.get("open")) openD(h.get("open"),false);
</script>
