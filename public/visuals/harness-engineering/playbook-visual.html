<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Implementation Playbook</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="./_theme-bootstrap.js"></script>
<link rel="stylesheet" href="./_theme.css">
<style>
/* Scene-specific: implementation playbook — tabbed L1-L5 cards. Fluid sizing. */
html, body { height: 100%; overflow: hidden; }
.shell {
  width: 100%; height: 100%;
  margin: 0;
  padding: clamp(10px, 1.6vh, 18px) clamp(14px, 2vw, 22px);
  display: grid; grid-template-rows: auto 1fr;
  gap: clamp(8px, 1.2vh, 14px);
  max-width: none;
}
.head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: end; }
.head h1 {
  font-family: "Space Grotesk", "Avenir Next", "Segoe UI", sans-serif; font-weight: 800;
  font-size: clamp(1rem, 2.2vh, 1.5rem); color: var(--text-strong);
  letter-spacing: -0.01em; line-height: 1.2;
}
.head p { color: var(--muted); font-size: clamp(0.78rem, 1.4vh, 0.92rem); margin-top: 4px; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab {
  appearance: none; border: 1px solid var(--border); background: var(--surface);
  color: var(--muted); font: inherit; cursor: pointer;
  padding: clamp(5px, 0.9vh, 8px) clamp(10px, 1.2vw, 14px);
  border-radius: 999px;
  font-size: clamp(0.72rem, 1.2vh, 0.84rem); font-weight: 700; letter-spacing: 0.04em;
  transition: 160ms ease;
  display: inline-flex; align-items: center; gap: 7px;
}
.tab:hover { color: var(--text-strong); border-color: var(--border-strong); }
.tab[aria-selected="true"] {
  color: var(--surface-strong);
  background: var(--c, var(--accent));
  border-color: var(--c, var(--accent));
  box-shadow: 0 6px 18px color-mix(in srgb, var(--c, var(--accent)) 28%, transparent);
}
.tab-num {
  font-family: "DM Sans", sans-serif; font-weight: 800; opacity: 0.9;
}
.tab .pic { width: 15px; height: 15px; }

.pic { display: block; color: inherit; }
.pic svg { width: 100%; height: 100%; }
.pic svg * { stroke: currentColor; }

.panel {
  min-height: 0;
  border: 1px solid var(--border); border-radius: 16px;
  background: var(--surface);
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr);
  overflow: hidden; box-shadow: var(--shadow);
}
.panel-info {
  padding: clamp(12px, 1.8vh, 20px) clamp(14px, 1.4vw, 20px);
  display: flex; flex-direction: column; gap: clamp(8px, 1.2vh, 14px);
  border-right: 1px solid var(--border);
  justify-content: flex-start;
}
.panel-tag {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: clamp(0.66rem, 1.05vh, 0.74rem); font-weight: 700; letter-spacing: 0.16em;
  text-transform: uppercase; color: var(--c);
}
.panel-tag .pic { width: 16px; height: 16px; }
.panel-title {
  font-family: "Space Grotesk", "Avenir Next", "Segoe UI", sans-serif; font-weight: 800;
  font-size: clamp(1.2rem, 2.4vh, 1.7rem); line-height: 1.15; color: var(--text-strong);
  letter-spacing: -0.01em;
}
.panel-meta {
  display: flex; flex-wrap: wrap; gap: clamp(5px, 0.7vw, 8px);
}
.meta-chip {
  font-size: clamp(0.68rem, 1.05vh, 0.76rem); font-weight: 600; letter-spacing: 0.04em;
  padding: 4px 10px; border-radius: 999px;
  border: 1px solid var(--border); background: var(--surface-strong);
  color: var(--muted);
}
.meta-chip strong { color: var(--text-strong); margin-right: 4px; font-weight: 700; }
.panel-purpose {
  font-size: clamp(0.86rem, 1.55vh, 1.04rem); line-height: 1.5; color: var(--text);
  /* Purpose paragraph absorbs vertical slack so info column fills naturally */
  flex: 1;
}
.panel-purpose strong { color: var(--text-strong); }
.panel-mvv {
  padding: clamp(8px, 1.2vh, 12px) clamp(10px, 1vw, 14px); border-radius: 12px;
  background: color-mix(in srgb, var(--c) 12%, transparent);
  border-left: 3px solid var(--c);
  font-size: clamp(0.8rem, 1.4vh, 0.92rem); line-height: 1.45;
  margin-top: 0;
}
.panel-mvv strong {
  display: block; margin-bottom: 2px;
  font-size: clamp(0.6rem, 0.95vh, 0.68rem); letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--c);
}
.panel-anti {
  padding: clamp(8px, 1.2vh, 12px) clamp(10px, 1vw, 14px); border-radius: 12px;
  background: color-mix(in srgb, var(--warn) 8%, transparent);
  border: 1px dashed color-mix(in srgb, var(--warn) 40%, transparent);
  font-size: clamp(0.76rem, 1.3vh, 0.86rem); line-height: 1.45; color: var(--text);
}
.panel-anti strong {
  display: block; margin-bottom: 2px;
  font-size: clamp(0.6rem, 0.95vh, 0.68rem); letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--warn);
}

.panel-examples {
  padding: clamp(12px, 1.8vh, 20px) clamp(14px, 1.4vw, 20px); min-height: 0;
  display: grid; grid-template-rows: auto 1fr;
  gap: clamp(8px, 1.2vh, 12px);
}
.examples-label {
  font-size: clamp(0.66rem, 1.05vh, 0.74rem); font-weight: 700; letter-spacing: 0.16em;
  text-transform: uppercase; color: var(--c);
}
.examples-list {
  list-style: none; display: grid;
  /* No row stretch — examples size to content; gap absorbs slack */
  grid-template-rows: repeat(auto-fit, max-content);
  gap: clamp(6px, 1vh, 10px); min-height: 0;
  overflow-y: auto; scrollbar-width: thin;
  align-content: start;
}
.example {
  border: 1px solid var(--border); border-radius: 12px;
  background: var(--surface-strong);
  padding: clamp(8px, 1.2vh, 12px) clamp(10px, 1vw, 14px);
  display: grid; grid-template-rows: auto auto; gap: 4px;
  opacity: 0; transform: translateY(10px);
  transition: opacity 380ms ease, transform 380ms ease;
}
.example.is-in { opacity: 1; transform: none; }
.example-head {
  font-family: "DM Sans", sans-serif; font-weight: 700;
  font-size: clamp(0.78rem, 1.35vh, 0.9rem); color: var(--text-strong);
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
.example-head::before {
  content: "→"; color: var(--c); font-weight: 800;
}
.badge {
  margin-left: auto;
  font-family: "DM Sans", sans-serif;
  font-size: clamp(0.58rem, 0.92vh, 0.66rem); font-weight: 800;
  letter-spacing: 0.12em; text-transform: uppercase;
  padding: 3px 8px; border-radius: 999px; white-space: nowrap;
}
.badge-build {
  color: var(--accent-2);
  background: color-mix(in srgb, var(--accent-2) 14%, transparent);
  border: 1px solid color-mix(in srgb, var(--accent-2) 38%, transparent);
}
.badge-platform {
  color: var(--accent);
  background: color-mix(in srgb, var(--accent) 14%, transparent);
  border: 1px solid color-mix(in srgb, var(--accent) 38%, transparent);
}
.example-detail { font-size: clamp(0.74rem, 1.2vh, 0.84rem); color: var(--muted); line-height: 1.4; padding-left: 18px; }
.example-code {
  margin-top: 6px; padding: clamp(6px, 1vh, 10px) clamp(8px, 1vw, 12px); border-radius: 8px;
  background: color-mix(in srgb, var(--text) 8%, transparent);
  border: 1px solid var(--border);
  font-family: "JetBrains Mono", "Consolas", monospace;
  font-size: clamp(0.66rem, 1.1vh, 0.78rem); line-height: 1.5;
  color: var(--text); white-space: pre; overflow-x: auto;
}
.badge-key {
  display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
  font-size: clamp(0.62rem, 1vh, 0.7rem); color: var(--muted-soft);
  letter-spacing: 0.04em;
}

@media (max-width: 880px) {
  .panel { grid-template-columns: 1fr; }
  .panel-info { border-right: 0; border-bottom: 1px solid var(--border); }
}
@media (prefers-reduced-motion: reduce) {
  .example { opacity: 1; transform: none; transition: none; }
}

/* Embed: size to content and report it, the parent autosizes the frame.
   Overrides the family theme's viewport lock, which would clip this scene. */
:root[data-embedded="true"], :root[data-embedded="true"] body { height: auto; overflow: visible; }
:root[data-embedded="true"] .shell { width: 100%; height: auto; padding: 14px 18px; }
:root[data-embedded="true"] .examples-list { overflow-y: visible; }
</style>
</head>
<body>
<main class="shell" id="playbook">
  <header class="head">
    <div>
      <span class="eyebrow">Implementation playbook</span>
      <h1>One min-viable move per layer. Ship this sprint.</h1>
      <p class="badge-key">
        <span class="badge badge-build" style="margin-left: 0">You build</span> developer residue in 2026
        <span class="badge badge-platform" style="margin-left: 0">Platform</span> inherited from the runtime
      </p>
    </div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Harness layers"></nav>
  </header>

  <section class="panel" id="panel" role="tabpanel" aria-live="polite">
    <!-- populated by JS -->
  </section>
</main>
<script>
(() => {
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- house icon loader ---------- */
  const ICON_BASE = '../customs-entry-agent/flow-icons/';
  const cache = {};
  const load = (n) => cache[n] || (cache[n] = fetch(ICON_BASE + n + '.svg')
    .then((r) => (r.ok ? r.text() : Promise.reject()))
    .then((t) => t.replace(/stroke="#232f3e"/g, 'stroke="currentColor"')).catch(() => ''));
  const paintIcons = () => {
    document.querySelectorAll('[data-ic]').forEach((slot) => {
      load(slot.dataset.ic).then((svg) => { if (!slot.firstChild) slot.innerHTML = svg; });
    });
  };

  const layers = [
    {
      id: 'L1', name: 'Constraint', color: 'var(--L1)', icon: 'barrier',
      owner: 'Architecture', rate: 'Slow', shipped: 'Developer-owned',
      metric: 'Prompts per run',
      purpose: 'Constrain the <strong>environment first, the text second</strong>. A sandbox the agent cannot escape beats a paragraph asking it not to. Rules that survive are mechanical: no LLM in the loop, zero false positives, whole categories of failure prevented without burning a token. The layer\'s success metric is <strong>prompts per run</strong> — not how many rules you wrote.',
      mvv: 'Run every agent session inside a sandbox profile with an explicit egress and filesystem policy, then add one custom linter rule per architectural decision you actually care about — each with a Fix: and a Reference: line.',
      anti: 'Treating the permission prompt as a control. Anthropic (How we contain Claude, 25 May 2026) found users approved roughly 93% of permission prompts — a checkbox that is almost always ticked is telemetry, not a constraint.',
      examples: [
        { h: 'Sandbox profile as the primary control', b: 'platform', d: 'gVisor, Seatbelt, or a microVM with vsock-only egress: the boundary is enforced by the kernel, not by the model reading a rule. Anthropic measured an 84% cut in prompt volume once environmental controls carried the load.', code: 'sandbox:\n  runtime: gvisor          # or seatbelt | microvm\n  filesystem:\n    write: [./worktree]\n    deny:  [~/.ssh, ~/.aws]\n  network:\n    transport: vsock        # no raw egress\n    allow: [registry.internal, api.github.com]' },
        { h: 'Auto mode: pre-execution interception', b: 'platform', d: 'Anthropic reports auto mode caught around 83% of overeager behaviour before execution at roughly a 0.4% false-block rate — the class of check that only works when it sits below the model.' },
        { h: 'Custom linter with actionable remediation', b: 'build', d: 'Every violation tells the agent how to fix it and where to read more.', code: 'ERROR: Naming convention violation\n  File: modules/billing/src/invoice_handler.py\n  Line: 47\n  Found: `processInvoice`\n  Fix: Rename to `process_invoice`\n  Reference: modules/billing/CONVENTIONS.md#naming' },
        { h: 'ArchUnit-style structural tests', b: 'build', d: 'Module boundaries and dependency directions enforced at every commit ("billing may not import from auth"). Textual rules, but mechanically checked.' }
      ]
    },
    {
      id: 'L2', name: 'Context', color: 'var(--L2)', icon: 'book',
      owner: 'Dev team', rate: 'Medium', shipped: 'Mostly platform',
      metric: 'Relevance, not capacity',
      purpose: 'Control what the model sees at each step. In 2026 the machinery is <strong>bought, not built</strong>: runtime compaction and history persistence are GA runtime features, and native million-token context shipped for Claude Code on 29 June 2026. Capacity is no longer the constraint, so the developer job compresses to <strong>curation — deciding what NOT to load</strong>.',
      mvv: 'A hand-written AGENTS.md under 100 lines describing only what a new engineer needs on day one — and an explicit list of what the harness must never auto-load.',
      anti: 'A 2,000-line LLM-generated AGENTS.md. ETH Zurich studied 138 agentfiles: LLM-generated ones slightly hurt performance while costing 20%+ more tokens. HumanLayer\'s working CLAUDE.md is under 60 lines. With a million tokens of room, relevance — not capacity — is what you are still paying for.',
      examples: [
        { h: 'Runtime compaction', b: 'platform', d: 'Automatic context compaction is now a GA runtime feature. Hand-rolled summarizer loops are maintenance you no longer owe.' },
        { h: 'History persistence across sessions', b: 'platform', d: 'The runtime keeps and rehydrates conversation history. Your job is deciding what deserves to come back, not writing the store.' },
        { h: 'Brief map at the repo root', b: 'build', d: 'A short hand-written AGENTS.md or CLAUDE.md — a map of the system, not an essay. Curation is the whole product here.', code: '# Project Brief\nBilling platform with three core modules.\n\n## Modules\n- modules/auth/          OAuth2 + API keys\n- modules/billing/       Subscriptions, invoicing, payments\n- modules/notifications/ Email, SMS, webhooks\n\n## Key Conventions\n- REST conventions in ARCHITECTURE.md\n- Module-specific patterns in each CONVENTIONS.md\n\n## Do NOT auto-load\n- generated/**, vendor/**, *.lock, fixtures/**' },
        { h: 'Progressive disclosure via per-module READMEs', b: 'build', d: 'The brief map points at modules; module READMEs hold the detail. Nothing loads unless the agent navigates there — the deliberate opposite of filling the window because you can.' }
      ]
    },
    {
      id: 'L3', name: 'Execution', color: 'var(--L3)', icon: 'gears',
      owner: 'Platform engineering', rate: 'Medium', shipped: 'Platform helps',
      metric: 'Tools exposed per task type',
      purpose: 'Give the agent the right hands for this task — no more. More tools usually produces worse results; this is where the "dumb zone" lives. The <strong>MCP 2026-07-28 revision</strong> reshaped the layer: a stateless core (no <code>initialize</code> handshake, no <code>Mcp-Session-Id</code>), <code>Mcp-Method</code> / <code>Mcp-Name</code> header routing, and background subagents that make execution genuinely concurrent.',
      mvv: 'Name the 6-10 tools each task type actually needs, expose only those, and put everything heavier behind a sub-agent.',
      anti: 'Connecting every MCP server you have because "the model can decide." It can — and it will spend more tokens deciding than doing. The 2026 variant: keeping a stateful, session-pinned transport alive because migrating felt optional.',
      examples: [
        { h: 'Stateless MCP core (2026-07-28)', b: 'platform', d: 'No initialize handshake and no Mcp-Session-Id: a tool call is a self-describing request routed by header, so any replica can serve it and load balancing stops being a special case.', code: 'POST /mcp HTTP/1.1\nMcp-Method: tools/call\nMcp-Name: billing.refund\nContent-Type: application/json\n\n{ "arguments": { "merchant_id": "m_812", "amount": 4200 } }' },
        { h: 'tools/list caching via ttlMs + cacheScope', b: 'platform', d: 'The tool catalogue is cacheable per scope with an explicit TTL, so tool definitions stop being re-paid on every turn.', code: '{\n  "tools": [ /* ... */ ],\n  "cache": { "ttlMs": 900000, "cacheScope": "session" }\n}' },
        { h: 'Background subagents', b: 'platform', d: 'Heavy work dispatches to a background subagent: execution becomes concurrent, and intermediate tool calls never pollute the parent context window.' },
        { h: 'Workstream: migrate off the deprecated surface', b: 'build', d: 'Roots, Sampling, Logging and the HTTP+SSE transport are all deprecated on a twelve-month window. Name an owner, inventory every server you run, and land the migration inside that window — this is scheduled work, not a someday item.' },
        { h: 'Dynamic tool scoping per task', b: 'build', d: 'HumanLayer replaced the full Linear MCP server (dozens of tools) with a custom CLI exposing six operations and saved thousands of tokens from tool definitions alone.' }
      ]
    },
    {
      id: 'L4', name: 'Verification', color: 'var(--L4)', icon: 'flask',
      owner: 'Dev + QA', rate: 'Fast', shipped: 'Developer-owned',
      metric: 'Checks that run before "done"',
      purpose: 'Prove the agent\'s output actually works before anything ships — still the highest-leverage layer most teams skip. Two things changed in 2026: human review became a protocol primitive via <strong>MRTR <code>input_required</code></strong>, and harness configuration became a recognised experimental variable, so eval runs now have to pin it.',
      mvv: 'One pre-stop hook that runs your existing test command and exits non-zero on failure. Boris Cherny: 2-3× output quality. Still the cheapest move on this page.',
      anti: 'Trusting the agent\'s own claim that "everything works." The model is fluent. Fluency is not correctness. The 2026 variant: publishing an eval number without recording the harness config that produced it.',
      examples: [
        { h: 'Pre-stop hooks: success silent, failure loud', b: 'build', d: 'Run formatters, type checkers, tests before the agent finishes a step. Swallow passing output, only surface errors.', code: '#!/bin/bash\n# .agent/hooks/pre-stop.sh\nset -e\nnpm run lint --silent || { echo "LINT FAILED"; exit 1; }\nnpm test --silent       || { echo "TESTS FAILED"; exit 1; }\n# Silent on success.' },
        { h: 'MRTR input_required: human review inside the call', b: 'platform', d: 'Human-in-the-loop is now a protocol primitive. The tool call parks in input_required and resumes on the human answer rather than restarting the run — review stops costing you the work already done.', code: '{\n  "status": "input_required",\n  "prompt": "Approve refund of $4,200 to merchant m_812?",\n  "resume_token": "rt_9f21c4"\n}' },
        { h: 'Harness-config manifest per eval run', b: 'build', d: 'Harness configuration is an experimental variable (arXiv:2607.04528, 5 July 2026): the same model scores differently under different harnesses. Pin the config, record it with the result, and treat an unpinned number as unpublished.', code: 'harness:\n  runtime: claude-code@2026.07\n  tools: [read, edit, bash, test]\n  sandbox: gvisor\n  context_window: 1000000\n  compaction: runtime-default\n  seed: 17' },
        { h: 'Golden-case eval suite', b: 'build', d: 'A small but real fixed set of input/output pairs the agent must pass before any change merges. Updated every time you find a new failure mode.' }
      ]
    },
    {
      id: 'L5', name: 'Lifecycle', color: 'var(--L5)', icon: 'gauge',
      owner: 'SRE / DevOps', rate: 'Slow once built', shipped: 'Mostly platform',
      metric: 'Cost per completed run',
      purpose: 'Keep the agent alive as a running process — startup, health, graceful shutdown, crash recovery, cost ceilings, escalation. In 2026 most of that arrived in the box: <strong>durable session logs, crash/resume and history persistence are GA runtime features</strong> in two platforms (Anthropic Managed Agents; Microsoft Agent Framework Harness, GA 22 July 2026). The developer residue is <strong>escalation policy and cost ceilings</strong> — the parts that encode your risk appetite, which no runtime can guess.',
      mvv: 'A session budget, a per-file edit cap, and one named human you can wake up if either trips.',
      anti: 'Hand-rolling the persistence machinery a runtime now gives you — building your own event store, resume protocol and history replay in 2026 is weeks spent re-deriving a GA feature. (The older horror story still applies: a long task with no budget, no checkpoint and no loop detection.)',
      examples: [
        { h: 'Durable session log + crash/resume', b: 'platform', d: 'The session is a durable event log outside the model context; wake(sessionId) resumes from the last good event. GA in Anthropic Managed Agents and in the Microsoft Agent Framework Harness (22 July 2026). Adopt it — do not rebuild it.' },
        { h: 'History persistence across restarts', b: 'platform', d: 'Conversation and tool history survive process death by default. The interesting question is retention policy, not storage.' },
        { h: 'Cost ceilings', b: 'build', d: 'Every session carries a budget; every exceedance triggers a named human, not a silent retry. Your numbers, your risk appetite — this stays yours.', code: 'limits:\n  session_usd_max: 25\n  edits_per_file_max: 8\n  wall_clock_minutes_max: 45\non_breach:\n  action: pause_and_escalate\n  notify: "@platform-oncall"' },
        { h: 'Escalation policy', b: 'build', d: 'Who gets woken, at what threshold, with what authority to kill the run. Loop detection (LangChain\'s LoopDetectionMiddleware) provides the trigger; the policy is the part you author.' }
      ]
    }
  ];

  const tabsEl = document.getElementById('tabs');
  const panelEl = document.getElementById('panel');

  const esc = (s) => s.replace(/</g, '&lt;');

  const animateExamples = () => {
    const items = Array.from(panelEl.querySelectorAll('.example'));
    const revealAll = () => items.forEach((el) => el.classList.add('is-in'));
    if (reduced || !('IntersectionObserver' in window)) { revealAll(); return; }
    const io = new IntersectionObserver((entries, obs) => {
      entries.forEach((entry) => {
        if (!entry.isIntersecting) return;
        obs.unobserve(entry.target);
        const i = items.indexOf(entry.target);
        setTimeout(() => entry.target.classList.add('is-in'), Math.max(i, 0) * 70);
      });
    }, { threshold: 0.01, rootMargin: '0px 0px -5% 0px' });
    items.forEach((el) => io.observe(el));
    setTimeout(revealAll, 2200);
  };

  const renderPanel = (layer) => {
    panelEl.style.setProperty('--c', layer.color);
    panelEl.setAttribute('aria-labelledby', 'tab-' + layer.id);
    panelEl.innerHTML = `
      <div class="panel-info">
        <span class="panel-tag"><span class="pic" data-ic="${layer.icon}" aria-hidden="true"></span>Layer ${layer.id.slice(1)} · ${layer.name}</span>
        <h2 class="panel-title">${layer.name}</h2>
        <div class="panel-meta">
          <span class="meta-chip"><strong>Owner</strong>${layer.owner}</span>
          <span class="meta-chip"><strong>Rate</strong>${layer.rate}</span>
          <span class="meta-chip"><strong>Metric</strong>${layer.metric}</span>
          <span class="meta-chip"><strong>${layer.shipped}</strong></span>
        </div>
        <p class="panel-purpose">${layer.purpose}</p>
        <div class="panel-mvv">
          <strong>Minimum viable</strong>
          ${layer.mvv}
        </div>
        <div class="panel-anti">
          <strong>Anti-pattern</strong>
          ${layer.anti}
        </div>
      </div>
      <div class="panel-examples">
        <span class="examples-label">Patterns</span>
        <ul class="examples-list">
          ${layer.examples.map((ex) => `
            <li class="example">
              <div class="example-head">${ex.h}<span class="badge ${ex.b === 'platform' ? 'badge-platform' : 'badge-build'}">${ex.b === 'platform' ? 'Platform' : 'You build'}</span></div>
              <div class="example-detail">${ex.d}</div>
              ${ex.code ? `<pre class="example-code">${esc(ex.code)}</pre>` : ''}
            </li>
          `).join('')}
        </ul>
      </div>
    `;
    paintIcons();
    animateExamples();
  };

  const select = (i, focus) => {
    const btns = Array.from(tabsEl.querySelectorAll('.tab'));
    btns.forEach((t, j) => {
      const on = i === j;
      t.setAttribute('aria-selected', String(on));
      t.tabIndex = on ? 0 : -1;
    });
    renderPanel(layers[i]);
    if (focus) btns[i].focus();
  };

  layers.forEach((layer, i) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'tab';
    btn.id = 'tab-' + layer.id;
    btn.setAttribute('role', 'tab');
    btn.setAttribute('aria-selected', i === 0 ? 'true' : 'false');
    btn.setAttribute('aria-controls', 'panel');
    btn.tabIndex = i === 0 ? 0 : -1;
    btn.style.setProperty('--c', layer.color);
    btn.innerHTML = '<span class="pic" data-ic="' + layer.icon + '" aria-hidden="true"></span>'
      + '<span class="tab-num">' + layer.id + '</span>' + layer.name;
    btn.addEventListener('click', () => select(i, false));
    btn.addEventListener('keydown', (e) => {
      const last = layers.length - 1;
      let next = null;
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') next = i === last ? 0 : i + 1;
      else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') next = i === 0 ? last : i - 1;
      else if (e.key === 'Home') next = 0;
      else if (e.key === 'End') next = last;
      if (next === null) return;
      e.preventDefault();
      select(next, true);
    });
    tabsEl.appendChild(btn);
  });

  paintIcons();
  select(0, false);
})();
</script>
<script>
(() => {
  /* Report content height so the parent frame hugs the content. */
  if (document.documentElement.dataset.embedded === 'true') {
    const postSize = () => window.parent.postMessage({ type: 'm2m:frame-size', height: document.body.scrollHeight }, '*');
    if ('ResizeObserver' in window) new ResizeObserver(postSize).observe(document.body);
    window.addEventListener('load', postSize);
    setTimeout(postSize, 400);
  }
})();
</script>
</body>
</html>
