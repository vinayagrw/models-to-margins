<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Operator Stories — A Day in the Life, Before and After AI</title>
<script src="./_theme-bootstrap.js"></script>
<link rel="stylesheet" href="./_theme.css">
<style>
/* Scene-specific: persona day-in-the-life stories.
   Persona tabs, a Before AI / After AI toggle, an icon-led four-step
   timeline with staged reveal, then automated vs still-human vs KPI chips. */
:root {
  --before: var(--warn);
  --after: var(--good);
  --m-proven: var(--good);
  --m-promising: var(--accent);
  --m-marketing: var(--warn);
}
:root[data-embedded="true"], :root[data-embedded="true"] body { height: auto; }

.shell { display: flex; flex-direction: column; gap: 10px; }
:root[data-embedded="true"] .shell {
  display: flex; flex-direction: column; gap: 8px;
  padding: 14px clamp(14px, 2vw, 22px);
}

.head { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
.head h1 {
  font-family: "Space Grotesk", sans-serif; font-weight: 700;
  font-size: clamp(1.05rem, 2.3vw, 1.45rem); letter-spacing: -0.02em; color: var(--text-strong);
}
:root[data-embedded="true"] .head h1 { font-size: 1.05rem; }

/* Inline icon slot: shared line-art SVGs, stroke swapped to currentColor */
.ic { display: inline-grid; place-items: center; width: 18px; height: 18px; flex: none; }
.ic svg { width: 100%; height: 100%; display: block; }
.ic svg * { stroke: currentColor; }

/* Persona tabs */
.tabs { display: flex; gap: 7px; flex-wrap: wrap; }
.tab {
  display: inline-flex; align-items: center; gap: 6px;
  font: 700 0.72rem/1.2 "Space Grotesk", sans-serif; letter-spacing: 0.02em;
  color: var(--muted); background: var(--surface); border: 1px solid var(--border);
  border-radius: 99px; padding: 7px 13px; cursor: pointer;
  transition: border-color .18s ease, color .18s ease, background .18s ease;
}
.tab .ic { width: 15px; height: 15px; }
.tab:hover { border-color: var(--border-strong); color: var(--text); }
.tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tab[aria-selected="true"] {
  color: var(--text-strong);
  border-color: color-mix(in srgb, var(--accent) 60%, var(--border-strong));
  background: color-mix(in srgb, var(--accent) 10%, var(--surface));
}
:root[data-embedded="true"] .tab { font-size: 0.7rem; padding: 5px clamp(9px, 1.2vw, 13px); }

/* Mode toggle + replay + summary line */
.mode-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.mode {
  display: inline-flex; border: 1px solid var(--border-strong); border-radius: 99px;
  overflow: hidden; background: var(--surface);
}
.mode button {
  font: 700 0.72rem/1 "Space Grotesk", sans-serif; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--muted); background: transparent; border: 0; padding: 8px 14px; cursor: pointer;
  transition: background .2s ease, color .2s ease;
}
.mode button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.mode button[aria-pressed="true"].m-before { background: color-mix(in srgb, var(--before) 14%, transparent); color: color-mix(in srgb, var(--before) 78%, var(--text-strong)); }
.mode button[aria-pressed="true"].m-after { background: color-mix(in srgb, var(--after) 16%, transparent); color: color-mix(in srgb, var(--after) 70%, var(--text-strong)); }
:root[data-embedded="true"] .mode button { font-size: 0.7rem; padding: 6px clamp(10px, 1.3vw, 14px); }

.replay {
  min-height: 32px; padding: 6px 12px; cursor: pointer; border-radius: 99px;
  font: 700 0.66rem/1 "Space Grotesk", sans-serif; letter-spacing: 0.07em; text-transform: uppercase;
  color: var(--accent); background: transparent; border: 1px solid var(--accent);
}
.replay:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.replay:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.mat-badge {
  display: inline-flex; align-items: center; gap: 6px;
  font: 700 0.69rem/1 "Space Grotesk", sans-serif; letter-spacing: 0.09em; text-transform: uppercase;
  color: var(--mm); padding: 5px 10px; border-radius: 99px;
  border: 1px solid color-mix(in srgb, var(--mm) 45%, transparent);
  background: color-mix(in srgb, var(--mm) 8%, transparent);
}
.mat-badge .ic { width: 14px; height: 14px; }
.summary { font: 400 0.75rem/1.45 "DM Sans", sans-serif; color: var(--muted); flex: 1 1 260px; min-width: 200px; }
:root[data-embedded="true"] .summary { font-size: 0.72rem; }
.hint { font: 400 0.68rem/1.3 "DM Sans", sans-serif; color: var(--muted-soft); }

/* Story area (fades on switch) */
.story { display: flex; flex-direction: column; gap: 10px; }
:root[data-embedded="true"] .story { gap: 8px; }
.story.fade { animation: sfade .3s ease-out; }
@keyframes sfade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* Timeline: icon-led step cards with staged reveal + click-to-expand */
.steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 9px; align-items: start; }
:root[data-embedded="true"] .steps { gap: clamp(5px, 0.8vw, 9px); }
.step {
  display: flex; flex-direction: column; gap: 5px; padding: 10px 12px; border-radius: 13px;
  border: 1px solid color-mix(in srgb, var(--mode-c) 30%, var(--border));
  background: var(--surface); box-shadow: var(--shadow-soft);
  cursor: pointer; text-align: left; font-family: inherit; width: 100%;
  opacity: 0.28; transform: translateY(4px);
  transition: opacity .35s ease, transform .35s ease, border-color .35s ease;
}
.step.lit { opacity: 1; transform: none; }
.step:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
:root[data-embedded="true"] .step { padding: 8px clamp(7px, 1.1vw, 12px); gap: 4px; }
.step-time {
  font: 700 0.7rem/1 "Space Grotesk", sans-serif; letter-spacing: 0.1em; color: var(--mode-c);
  display: flex; align-items: center; gap: 7px;
}
.step-time::after { content: ""; flex: 1; height: 1px; background: color-mix(in srgb, var(--mode-c) 35%, transparent); }
.step-head { display: flex; align-items: flex-start; gap: 8px; }
.step-pic {
  width: 30px; height: 30px; flex: none; display: grid; place-items: center; border-radius: 9px;
  border: 1.5px solid color-mix(in srgb, var(--mode-c) 40%, var(--border-strong));
  color: var(--muted); transition: color .35s ease, box-shadow .35s ease;
}
.step-pic svg { width: 19px; height: 19px; display: block; }
.step-pic svg * { stroke: currentColor; }
.step.lit .step-pic { color: var(--mode-c); box-shadow: 0 0 0 3px color-mix(in srgb, var(--mode-c) 14%, transparent); }
.step-title { font: 700 0.78rem/1.25 "Space Grotesk", sans-serif; color: var(--text-strong); letter-spacing: -0.01em; }
.step-detail {
  display: none; font: 400 0.72rem/1.4 "DM Sans", sans-serif; color: var(--muted);
  border-left: 2px solid color-mix(in srgb, var(--mode-c) 45%, transparent); padding-left: 8px;
}
.step[aria-expanded="true"] .step-detail { display: block; }
:root[data-embedded="true"] .step-title { font-size: 0.75rem; }
:root[data-embedded="true"] .step-detail { font-size: 0.7rem; }

/* Chips footer */
.facts { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 9px; }
:root[data-embedded="true"] .facts { gap: clamp(5px, 0.8vw, 9px); }
.fact {
  display: flex; flex-direction: column; gap: 6px; padding: 9px 12px; border-radius: 12px;
  border: 1px solid color-mix(in srgb, var(--fc) 30%, var(--border));
  background: color-mix(in srgb, var(--fc) 5%, transparent);
}
:root[data-embedded="true"] .fact { padding: 7px clamp(7px, 1.1vw, 12px); gap: 5px; }
.fact-label {
  display: flex; align-items: center; gap: 6px;
  font: 700 0.69rem/1 "Space Grotesk", sans-serif; letter-spacing: 0.11em; text-transform: uppercase;
  color: color-mix(in srgb, var(--fc) 70%, var(--text-strong));
}
.fact-label .ic { width: 15px; height: 15px; }
.fact-chips { display: flex; flex-wrap: wrap; gap: 5px; }
.fchip {
  font: 500 0.7rem/1.3 "DM Sans", sans-serif; color: var(--text);
  padding: 3px 9px; border-radius: 99px;
  border: 1px solid color-mix(in srgb, var(--fc) 32%, var(--border));
  background: var(--surface);
}
:root[data-embedded="true"] .fchip { font-size: 0.7rem; }

@media (prefers-reduced-motion: reduce) {
  .story.fade { animation: none; }
  .step { transition: none; }
}
@media (max-width: 860px) { .steps { grid-template-columns: 1fr 1fr; } }
@media (max-width: 760px) {
  .facts { grid-template-columns: 1fr; }
  .summary { display: none; }
}
@media (max-width: 560px) { .steps { grid-template-columns: 1fr; } }
</style>
</head>

<div class="shell">

  <header class="head">
    <div>

</div>

<script>
(() => {
  const ICON_BASE = '../customs-entry-agent/flow-icons/';
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const stories = JSON.parse(document.getElementById('data').textContent);
  const tabs = document.getElementById('tabs');
  const story = document.getElementById('story');
  const stepsEl = document.getElementById('steps');
  const summary = document.getElementById('summary');
  const mat = document.getElementById('mat');
  const btnBefore = document.getElementById('btn-before');
  const btnAfter = document.getElementById('btn-after');
  const matColor = { proven: 'var(--m-proven)', promising: 'var(--m-promising)', marketing: 'var(--m-marketing)' };
  const matLabel = { proven: 'Proven', promising: 'Promising', marketing: 'Marketing' };

  /* Shared line-art icons, fetched once per name and inlined with the stroke
     swapped to currentColor. A failed fetch leaves the slot empty and the
     text still carries the card. */
  const iconCache = new Map();
  function loadIcon(name) {
    if (!iconCache.has(name)) {
      iconCache.set(name, fetch(ICON_BASE + name + '.svg')
        .then((r) => (r.ok ? r.text() : Promise.reject()))
        .then((t) => t.replace(/stroke="#232f3e"/g, 'stroke="currentColor"'))
        .catch(() => ''));
    }
    return iconCache.get(name);
  }
  function fillIcons(root) {
    root.querySelectorAll('[data-ic]').forEach((slot) => {
      loadIcon(slot.dataset.ic).then((svg) => { slot.innerHTML = svg; });
    });
  }
  fillIcons(document);

  let current = stories[0];
  let mode = 'after';
  let seen = false;
  let raf = 0;

  stories.forEach((s, i) => {
    const tab = document.createElement('button');
    tab.className = 'tab';
    tab.type = 'button';
    tab.setAttribute('role', 'tab');
    tab.setAttribute('aria-selected', i === 0 ? 'true' : 'false');
    tab.innerHTML = '<span class="ic" data-ic="' + s.taskIcon + '" aria-hidden="true"></span>' + s.tab;
    tab.addEventListener('click', () => {
      current = s;
      tabs.querySelectorAll('.tab').forEach(t =>
        t.setAttribute('aria-selected', t === tab ? 'true' : 'false'));
      render();
    });
    tabs.appendChild(tab);
    fillIcons(tab);
  });

  btnBefore.addEventListener('click', () => setMode('before'));
  btnAfter.addEventListener('click', () => setMode('after'));
  function setMode(m) {
    if (mode === m) return;
    mode = m;
    btnBefore.setAttribute('aria-pressed', m === 'before' ? 'true' : 'false');
    btnAfter.setAttribute('aria-pressed', m === 'after' ? 'true' : 'false');
    render();
  }

  function chips(id, list) {
    document.getElementById(id).innerHTML =
      list.map(t => '<span class="fchip">' + t + '</span>').join('');
  }

  /* Staged reveal: the shift lights up step by step. rAF t0 comes from the
     first frame timestamp, never performance.now(): sandboxed iframes can
     disagree between the two clocks. Reduced motion jumps straight to the
     finished, fully-lit state. */
  const STAGGER = 320;
  function reveal() {
    cancelAnimationFrame(raf);
    const cards = Array.from(stepsEl.querySelectorAll('.step'));
    cards.forEach((c) => c.classList.remove('lit'));
    if (reduced) { cards.forEach((c) => c.classList.add('lit')); return; }
    let t0 = null;
    const step = (ts) => {
      if (t0 === null) t0 = ts;
      const n = Math.min(cards.length, Math.floor((ts - t0) / STAGGER) + 1);
      for (let k = 0; k < n; k++) cards[k].classList.add('lit');
      if (n < cards.length) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
  }

  function render() {
    story.classList.remove('fade');
    void story.offsetWidth;
    story.classList.add('fade');
    const modeColor = mode === 'before' ? 'var(--before)' : 'var(--after)';
    summary.textContent = current.summary;
    mat.innerHTML =
      '<span class="ic" data-ic="' + current.leadIcon + '" aria-hidden="true"></span>' +
      '<span class="ic" data-ic="' + current.taskIcon + '" aria-hidden="true"></span>' +
      matLabel[current.maturity] + ' · ' + current.persona;
    mat.style.setProperty('--mm', matColor[current.maturity]);
    stepsEl.innerHTML = current[mode].map(step =>
      '<button type="button" class="step" aria-expanded="false" style="--mode-c:' + modeColor + '">' +
        '<span class="step-time">' + step.time + '</span>' +
        '<span class="step-head">' +
          '<span class="step-pic" data-ic="' + step.icon + '" aria-hidden="true"></span>' +
          '<span class="step-title">' + step.title + '</span>' +
        '</span>' +
        '<span class="step-detail">' + step.detail + '</span>' +
      '</button>').join('');
    fillIcons(stepsEl);
    stepsEl.querySelectorAll('.step').forEach((card) => {
      card.addEventListener('click', () => {
        const open = card.getAttribute('aria-expanded') === 'true';
        card.setAttribute('aria-expanded', String(!open));
      });
    });
    chips('chips-auto', current.automated);
    chips('chips-human', current.human);
    chips('chips-kpi', current.kpis);
    if (seen) reveal();
  }

  document.getElementById('replay').addEventListener('click', reveal);

  /* Autoplay once when the figure scrolls into view. threshold 0, not 0.2:
     the figure can exceed a phone viewport, and a fraction of a too-tall
     element never intersects. */
  if ('IntersectionObserver' in window) {
    const io = new IntersectionObserver((entries) => {
      if (entries.some((e) => e.isIntersecting)) { io.disconnect(); seen = true; reveal(); }
    }, { threshold: 0 });
    io.observe(story);
  } else { seen = true; reveal(); }

  render();

  if (document.documentElement.dataset.embedded === 'true') {
    const postSize = () => window.parent.postMessage({ type: 'm2m:frame-size', height: document.body.scrollHeight }, '*');
    if ('ResizeObserver' in window) new ResizeObserver(postSize).observe(document.body);
    window.addEventListener('load', postSize);
  }
})();
</script>
</body>
</html>
