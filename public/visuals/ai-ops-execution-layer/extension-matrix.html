<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Extension Matrix — Five Capabilities Across Seven Industries</title>
<script src="./_theme-bootstrap.js"></script>
<link rel="stylesheet" href="./_theme.css">
<style>
/* Scene-specific: capability x industry extension matrix.
   Rows and columns are icon-led, each cell carries a maturity pictogram so the
   encoding is never color-only. Cells stamp in staged, click any cell for the
   combo detail, filter chips dim non-matching maturity. */
:root {
  --m-proven: var(--good);
  --m-promising: var(--accent);
  --m-marketing: var(--warn);
}
:root[data-embedded="true"], :root[data-embedded="true"] body { height: auto; }

.shell { display: flex; flex-direction: column; gap: 10px; }
:root[data-embedded="true"] .shell { padding: clamp(10px, 1.5vh, 16px) clamp(14px, 2vw, 22px); }

.head h1 {
  font-family: "Space Grotesk", sans-serif; font-weight: 700;
  font-size: clamp(1.0rem, 2.3vw, 1.35rem); letter-spacing: -0.02em; color: var(--text-strong);
}

.ctl { display: flex; align-items: center; gap: 8px 10px; flex-wrap: wrap; }
.ctl .replay {
  min-height: 34px; padding: 6px 12px; cursor: pointer; border-radius: 99px;
  font: 700 0.66rem/1 "Space Grotesk", sans-serif; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--accent); background: transparent; border: 1px solid var(--accent);
}
.ctl .replay:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }

.chips { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; }
.chip {
  font: 700 0.68rem/1 "Space Grotesk", sans-serif; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--muted); background: var(--surface); border: 1px solid var(--border);
  border-radius: 99px; padding: 5px 11px; cursor: pointer; display: flex; align-items: center; gap: 6px;
  transition: border-color .18s ease, color .18s ease;
}
.chip .ci { width: 14px; height: 14px; display: grid; place-items: center; color: var(--cc, var(--muted-soft)); }
.chip .ci svg { width: 14px; height: 14px; display: block; }
.chip .ci svg * { stroke: currentColor; }
.chip:hover { border-color: var(--border-strong); color: var(--text); }
.chip[aria-pressed="true"] {
  color: var(--text-strong); border-color: color-mix(in srgb, var(--cc, var(--accent)) 55%, var(--border-strong));
  background: color-mix(in srgb, var(--cc, var(--accent)) 9%, var(--surface));
}

.matrix-wrap { overflow-x: auto; overscroll-behavior-x: contain; border-radius: 14px; }
.matrix {
  display: grid; grid-template-columns: minmax(120px, 150px) repeat(7, minmax(88px, 1fr));
  gap: 5px; min-width: 780px;
}
.mx-col {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  font: 700 0.67rem/1.2 "Space Grotesk", sans-serif; letter-spacing: 0.07em; text-transform: uppercase;
  color: var(--muted); text-align: center; align-self: end; padding: 4px 2px;
}
.mx-col .hi, .mx-row .hi {
  width: 22px; height: 22px; display: grid; place-items: center; color: var(--muted); flex: 0 0 auto;
}
.mx-col .hi svg, .mx-row .hi svg { width: 20px; height: 20px; display: block; }
.mx-col .hi svg *, .mx-row .hi svg * { stroke: currentColor; }
.mx-row { display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 2px; }
.mx-row .hi { width: 26px; height: 26px; color: var(--accent); }
.mx-row .hi svg { width: 22px; height: 22px; }
.mx-row-t { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.mx-row-t b { font: 700 0.77rem/1.2 "Space Grotesk", sans-serif; color: var(--text-strong); letter-spacing: -0.01em; }
.mx-row-t small { font: 700 0.66rem/1.2 "Space Grotesk", sans-serif; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }

.cell {
  position: relative; display: flex; flex-direction: column; gap: 5px; text-align: left;
  padding: 8px 9px; border-radius: 10px; cursor: pointer; font-family: inherit;
  border: 1px solid color-mix(in srgb, var(--mc) 30%, var(--border));
  background: color-mix(in srgb, var(--mc) 6%, var(--surface));
  color: var(--text); min-height: 52px;
  opacity: 0; transform: scale(0.86);
  transition: opacity .3s ease, transform .3s ease, border-color .2s ease;
}
.cell.stamped { opacity: 1; transform: none; }
.cell:hover { border-color: color-mix(in srgb, var(--mc) 60%, var(--border)); }
.cell[aria-pressed="true"] {
  border-color: var(--mc);
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--mc) 35%, transparent);
}
.cell.stamped.dim { opacity: 0.22; }
.mi { width: 16px; height: 16px; display: grid; place-items: center; color: var(--mc); flex: 0 0 auto; }
.mi svg { width: 15px; height: 15px; display: block; }
.mi svg * { stroke: currentColor; }
.cell-top { display: flex; align-items: center; gap: 5px; }
.cell-mat { font: 700 0.67rem/1 "Space Grotesk", sans-serif; letter-spacing: 0.07em; text-transform: uppercase; color: var(--mc); }
.cell-micro { font: 500 0.7rem/1.25 "DM Sans", sans-serif; color: var(--muted); }

.panel {
  border: 1px solid var(--border); border-radius: 14px; background: var(--surface);
  box-shadow: var(--shadow-soft); padding: 12px 15px;
  display: flex; flex-direction: column; gap: 8px; min-height: 118px; overflow-y: auto;
}
.panel.fade { animation: pfade .28s ease-out; }
.panel-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.panel-title { font: 700 0.95rem/1.2 "Space Grotesk", sans-serif; color: var(--text-strong); letter-spacing: -0.01em; }
.panel-badge {
  display: inline-flex; align-items: center; gap: 5px;
  font: 700 0.67rem/1 "Space Grotesk", sans-serif; letter-spacing: 0.09em; text-transform: uppercase;
  color: var(--mc); padding: 4px 9px; border-radius: 99px;
  border: 1px solid color-mix(in srgb, var(--mc) 45%, transparent);
  background: color-mix(in srgb, var(--mc) 8%, transparent);
}
.panel-badge .mi { width: 14px; height: 14px; }
.panel-badge .mi svg { width: 13px; height: 13px; }
.panel-combo { font: 700 0.68rem/1 "Space Grotesk", sans-serif; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
.panel-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px 16px; }
.pf { display: flex; flex-direction: column; gap: 2px; }
.pf small { font: 700 0.67rem/1.2 "Space Grotesk", sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted-soft); }
.pf span { font: 400 0.74rem/1.4 "DM Sans", sans-serif; color: var(--text); }
.panel-empty { font: 500 0.76rem/1.4 "DM Sans", sans-serif; color: var(--muted); font-style: italic; margin: auto 0; }

@keyframes pfade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  .panel.fade { animation: none; }
  .cell { opacity: 1; transform: none; transition: none; }
}
@media (max-width: 760px) {
  .cell-micro { display: none; }
  .matrix { min-width: 640px; grid-template-columns: minmax(104px, 120px) repeat(7, minmax(72px, 1fr)); }
  .panel-grid { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 620px) {
  .head h1 { font-size: 0.95rem; }
  .ctl { flex-direction: column; align-items: flex-start; }
}
</style>
</head>

  const panel = document.getElementById('panel');
  const chips = document.getElementById('chips');
  const matColor = { proven: 'var(--m-proven)', promising: 'var(--m-promising)', marketing: 'var(--m-marketing)' };
  const matLabel = { proven: 'Proven', promising: 'Promising', marketing: 'Marketing' };
  const matIcon = { proven: 'check', promising: 'flask', marketing: 'megaphone' };
  const capById = Object.fromEntries(data.capabilities.map(c => [c.id, c]));
  const indById = Object.fromEntries(data.industries.map(i => [i.id, i]));
  const extMap = {};
  data.extensions.forEach(e => { extMap[e.capabilityId + ':' + e.industryId] = e; });

  /* Shared line-art icons, fetched once per name and inlined with the stroke
     swapped to currentColor so each slot follows its own theme colour. A failed
     fetch leaves the slot empty and the text still carries the cell. */
  const iconCache = {};
  const loadIcon = (name, slot) => {
    if (!iconCache[name]) {
      iconCache[name] = fetch(ICON_BASE + name + '.svg')
        .then(r => (r.ok ? r.text() : Promise.reject()))
        .then(t => t.replace(/stroke="#232f3e"/g, 'stroke="currentColor"'))
        .catch(() => '');
    }
    iconCache[name].then(svg => { slot.innerHTML = svg; });
  };

  let filter = 'all';

  // Header row: industry columns led by their pictograms
  const corner = document.createElement('div');
  corner.setAttribute('role', 'presentation');
  matrix.appendChild(corner);
  data.industries.forEach(ind => {
    const el = document.createElement('div');
    el.className = 'mx-col';
    el.setAttribute('role', 'columnheader');
    const hi = document.createElement('span');
    hi.className = 'hi';
    hi.setAttribute('aria-hidden', 'true');
    loadIcon(ind.icon, hi);
    el.appendChild(hi);
    el.appendChild(document.createTextNode(ind.label));
    matrix.appendChild(el);
  });

  // Rows: capability headers led by their pictograms, cells carry a maturity icon
  const cells = [];
  data.capabilities.forEach(cap => {
    const rowHead = document.createElement('div');
    rowHead.className = 'mx-row';
    rowHead.setAttribute('role', 'rowheader');
    const hi = document.createElement('span');
    hi.className = 'hi';
    hi.setAttribute('aria-hidden', 'true');
    loadIcon(cap.icon, hi);
    rowHead.appendChild(hi);
    const t = document.createElement('span');
    t.className = 'mx-row-t';
    t.innerHTML = '<small>' + cap.sequence + '</small><b>' + cap.title + '</b>';
    rowHead.appendChild(t);
    matrix.appendChild(rowHead);

    data.industries.forEach(ind => {
      const key = cap.id + ':' + ind.id;
      const ext = extMap[key];
      const btn = document.createElement('button');
      btn.className = 'cell';
      btn.type = 'button';
      btn.dataset.key = key;
      btn.dataset.mat = ext.maturity;
      btn.setAttribute('aria-pressed', 'false');
      btn.setAttribute('aria-label', cap.title + ' in ' + ind.label + ', ' + matLabel[ext.maturity] + '. ' + ext.title);
      btn.style.setProperty('--mc', matColor[ext.maturity]);
      btn.innerHTML =
        '<span class="cell-top"><span class="mi" data-mi aria-hidden="true"></span><span class="cell-mat">' + matLabel[ext.maturity] + '</span></span>' +
        '<span class="cell-micro">' + ext.micro + '</span>';
      loadIcon(matIcon[ext.maturity], btn.querySelector('[data-mi]'));
      btn.addEventListener('click', () => select(key));
      matrix.appendChild(btn);
      cells.push(btn);
    });
  });

  chips.querySelectorAll('.chip .ci').forEach(ci => loadIcon(ci.dataset.ic, ci));

  function select(key) {
    matrix.querySelectorAll('.cell').forEach(c =>
      c.setAttribute('aria-pressed', c.dataset.key === key ? 'true' : 'false'));
    const ext = extMap[key];
    const cap = capById[ext.capabilityId];
    const ind = indById[ext.industryId];
    panel.classList.remove('fade');
    void panel.offsetWidth;
    panel.classList.add('fade');
    panel.style.setProperty('--mc', matColor[ext.maturity]);
    panel.innerHTML =
      '<div class="panel-head">' +
        '<span class="panel-title">' + ext.title + '</span>' +
        '<span class="panel-badge"><span class="mi" data-pmi aria-hidden="true"></span>' + matLabel[ext.maturity] + '</span>' +
        '<span class="panel-combo">' + cap.title + ' &middot; ' + ind.label + '</span>' +
      '</div>' +
      '<div class="panel-grid">' +
        '<div class="pf"><small>Buyer</small><span>' + ext.buyer + '</span></div>' +
        '<div class="pf"><small>Workflow</small><span>' + ext.workflow + '</span></div>' +
        '<div class="pf"><small>Pain</small><span>' + ext.pain + '</span></div>' +
        '<div class="pf"><small>Wedge</small><span>' + ext.wedge + '</span></div>' +
        '<div class="pf"><small>Integrations</small><span>' + ext.integrations + '</span></div>' +
      '</div>';
    loadIcon(matIcon[ext.maturity], panel.querySelector('[data-pmi]'));
  }

  chips.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      filter = chip.dataset.f;
      chips.querySelectorAll('.chip').forEach(c =>
        c.setAttribute('aria-pressed', c === chip ? 'true' : 'false'));
      matrix.querySelectorAll('.cell').forEach(c =>
        c.classList.toggle('dim', filter !== 'all' && c.dataset.mat !== filter));
    });
  });

  /* Cells stamp in row by row. rAF t0 comes from the first frame timestamp,
     never performance.now(): sandboxed iframes can disagree between the two clocks. */
  const STEP = 42;
  let raf = 0;
  const run = () => {
    cancelAnimationFrame(raf);
    cells.forEach(c => c.classList.remove('stamped'));
    if (reduced) { cells.forEach(c => c.classList.add('stamped')); return; }
    let t0 = null;
    const step = (ts) => {
      if (t0 === null) t0 = ts;
      const n = Math.min(cells.length, Math.floor((ts - t0) / STEP) + 1);
      for (let k = 0; k < n; k++) cells[k].classList.add('stamped');
      if (n < cells.length) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
  };

  document.getElementById('replay').addEventListener('click', run);

  /* threshold 0, not 0.2: the matrix can exceed a phone viewport, and a
     fraction of a too-tall element never intersects. */
  if ('IntersectionObserver' in window) {
    const io = new IntersectionObserver((entries) => {
      if (entries.some(e => e.isIntersecting)) { io.disconnect(); run(); }
    }, { threshold: 0 });
    io.observe(matrix);
  } else { run(); }

  // Default selection so the panel is never empty for long
  select('actions:transport');

  if (document.documentElement.dataset.embedded === 'true') {
    const postSize = () => window.parent.postMessage({ type: 'm2m:frame-size', height: document.body.scrollHeight }, '*');
    if ('ResizeObserver' in window) new ResizeObserver(postSize).observe(document.body);
    window.addEventListener('load', postSize);
  }
})();
</script>
</body>
</html>
