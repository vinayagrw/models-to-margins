<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Last 30 Days — Metrics & Eval SOTA</title>
<script src="./_theme-bootstrap.js"></script>
<link rel="stylesheet" href="./_theme.css">
<style>
:root[data-embedded="true"], :root[data-embedded="true"] body { height: auto; }
.shell { display: flex; flex-direction: column; gap: clamp(8px,1.5vh,16px); }
.head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; }
.head h1 { font-size: clamp(1.12rem,2.1vw,1.6rem); font-weight: 700; letter-spacing: -0.02em; color: var(--text-strong); }
.head p { color: var(--muted); font-size: 0.82rem; }

.ctl { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.ctl button {
  min-height: 32px; padding: 5px 12px; cursor: pointer; border-radius: 999px;
  font: 700 0.66rem/1 "Space Grotesk", "Segoe UI", sans-serif; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--accent); background: transparent; border: 1px solid var(--accent);
}
.ctl button:hover { background: color-mix(in srgb, var(--accent) 14%, transparent); }
.ctl .hint { font-size: 0.7rem; color: var(--muted-soft); }

/* The track: an icon per release rides one timeline. Icons are the primary
   encoding, the sweep line is the month passing left to right. */
.track { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; }
.trackline, .trackfill {
  position: absolute; left: 2%; right: 2%; height: 2px; border-radius: 2px;
  top: 0; /* set from the measured icon centers by script */
}
.trackline { background: var(--border-strong); }
.trackfill {
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  transform-origin: left center; transform: scaleX(0);
}
.tnode {
  background: none; border: none; font: inherit; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 5px;
  position: relative; padding: 0 2px; min-width: 0;
}
.tdate { font-size: 0.62rem; font-weight: 700; color: var(--text-strong); letter-spacing: 0.01em; text-align: center; }
.tpic {
  width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
  background: var(--surface-strong); border: 2px solid var(--border-strong);
  color: var(--muted-soft); z-index: 1;
  transition: color 280ms, border-color 280ms, box-shadow 280ms, transform 200ms;
}
.tpic svg { width: 20px; height: 20px; display: block; }
.tpic svg * { stroke: currentColor; }
.tnode.lit .tpic { color: var(--c); border-color: var(--c); box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 18%, transparent); }
.tnode[aria-selected="true"] .tpic { transform: scale(1.14); }
.ttitle { font-size: 0.66rem; color: var(--muted); text-align: center; line-height: 1.18; max-width: 14ch; }
.tnode[aria-selected="true"] .ttitle { color: var(--text); }

.panel { border-radius: 14px; border: 1px solid var(--border); background: var(--surface); padding: 14px 16px; box-shadow: var(--shadow-soft); display: grid; gap: 6px; min-height: 132px; align-content: start; }
.panel .pmeta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.panel .pdate { font-size: 0.66rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #fff; background: var(--c); padding: 3px 9px; border-radius: 999px; }
.panel .psrc { font-size: 0.68rem; color: var(--muted); }
.panel .pconf { font-size: 0.6rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--good); border: 1px solid color-mix(in srgb, var(--good) 45%, transparent); padding: 2px 7px; border-radius: 999px; }
.panel h2 { font-size: 1rem; color: var(--text-strong); font-weight: 700; }
.panel .pbody { font-size: 0.86rem; line-height: 1.46; color: var(--text); }
.panel .pbody b { color: var(--text-strong); }
.panel .pwhy { font-size: 0.78rem; color: var(--muted); border-left: 2px solid var(--c); padding-left: 9px; }

@media (max-width: 720px) { .ttitle { display: none; } }
@media (max-width: 620px) {
  .tpic { width: 30px; height: 30px; }
  .tpic svg { width: 18px; height: 18px; }
  .tdate { font-size: 0.56rem; }
}
@media (prefers-reduced-motion: reduce) {
  .trackfill { transition: none; }
  .tpic { transition: none; }
}
</style>
</head>
<body>
<main class="shell">
  <div class="head">
    <h1>What changed in the last 30 days.</h1>
    <p>Every link still points one way: evals belong on the production-trace substrate. Click a node.</p>
  </div>
  <div class="ctl">
    <button type="button" id="replay">Replay month</button>
    <span class="hint">The sweep replays the month in order. Tap any node for its detail.</span>
  </div>
  <div class="track" id="track" role="listbox" aria-label="Timeline of the last 30 days">
    <span class="trackline" id="trackline" aria-hidden="true"></span>
    <span class="trackfill" id="trackfill" aria-hidden="true"></span>
  </div>
  <div class="panel" id="panel" style="--c: var(--out)"></div>
</main>
<script>
(() => {
const ITEMS = [
  { date:'May 25–29', full:'May 25–29, 2026', c:'--out', icon:'flask', conf:'High', title:'Langfuse Launch Week', src:'langfuse.com',
    h:'Eval primitives, shipped',
    body:'Deterministic <b>code evaluators</b> beside the LLM judge, an <b>LLM-judge calibration skill</b> (auto precision/recall/F1), and <b>CI/CD experiments</b> that fail a PR when scores drop.',
    why:'The exact primitives this playbook calls for — now off-the-shelf, not a build.' },
  { date:'May 31', full:'May 31, 2026', c:'--sys', icon:'gauge', conf:'High', title:'Wasted-Computation diagnosis', src:'arXiv:2606.01365',
    h:'Failure-aware agent observability',
    body:'Maps tool retries, loops, and budget pressure to <b>online trace signals</b> across 165 GAIA agent traces — diagnosing wasted computation <i>before</i> the bill lands.',
    why:'Operationalizes "cost per <i>successful</i> task" and trajectory-aware metrics on the trace spine.' },
  { date:'Jun 15', full:'Jun 15, 2026', c:'--biz', icon:'coin', conf:'High', title:'Metered agent billing', src:'Anthropic',
    h:'Per-session cost becomes observable',
    body:'Agent SDK / Claude Code usage moves onto <b>metered API billing</b> — managed agents priced at ~<b>$0.08 / session-hour</b> + tokens.',
    why:'A live market move toward attributable per-task cost — the System-to-Business margin bridge made real.' },
  { date:'Jun 16', full:'Jun 16, 2026', c:'--mod', icon:'exchange', conf:'High', title:'OpenAI Deployment Simulation', src:'openai.com',
    h:'Production replay as an eval',
    body:'Replay ~1.3M de-identified conversations through a <b>candidate</b> model, regrade, estimate deployment-time behavior change. <b>92% directional accuracy</b> — but only directional: median multiplicative error <b>~1.5×</b>, tails to ~10×.',
    why:'Validates "production replay" as a pattern — and reinforces decision-agreement over point estimates.' },
  { date:'Jun 17', full:'Jun 17, 2026', c:'--out', icon:'scales', conf:'High', title:'Reliability without Validity', src:'arXiv:2606.19544',
    h:'The largest LLM-judge audit yet',
    body:'21 judges: test-retest reliability >0.95 <i>coexists</i> with severe position bias. Raw agreement <b>overstates chance-corrected κ by 33–41 points</b>; rankings shift up to 14 positions across benchmarks.',
    why:'Kills "~85–90% raw agreement" as a target. Report chance-corrected <b>κ ≥ 0.6</b> + bias audits instead.' },
];

const ICON_BASE = '../customs-entry-agent/flow-icons/';
const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const track = document.getElementById('track');
const fill = document.getElementById('trackfill');
const line = document.getElementById('trackline');
const panel = document.getElementById('panel');

ITEMS.forEach((it, i) => {
  const b = document.createElement('button');
  b.className = 'tnode'; b.dataset.i = i; b.type = 'button';
  b.setAttribute('role', 'option'); b.setAttribute('aria-selected', 'false');
  b.style.setProperty('--c', `var(${it.c})`);
  b.innerHTML = `<span class="tdate">${it.date}</span><span class="tpic" data-pic aria-hidden="true"></span><span class="ttitle">${it.title}</span>`;
  b.addEventListener('click', () => sel(i));
  track.appendChild(b);
});
const nodes = Array.from(track.querySelectorAll('.tnode'));

/* Icons are the shared line-art SVGs, fetched and inlined with the stroke
   swapped to currentColor so each disc takes its layer's color when lit.
   A failed fetch leaves the slot empty and the date still carries the node. */
nodes.forEach((n, i) => {
  const slot = n.querySelector('[data-pic]');
  fetch(ICON_BASE + ITEMS[i].icon + '.svg')
    .then((r) => (r.ok ? r.text() : Promise.reject()))
    .then((t) => { slot.innerHTML = t.replace(/stroke="#232f3e"/g, 'stroke="currentColor"'); })
    .catch(() => {});
});

function sel(i) {
  const it = ITEMS[i];
  nodes.forEach((n) => n.setAttribute('aria-selected', n.dataset.i == i ? 'true' : 'false'));
  panel.style.setProperty('--c', `var(${it.c})`);
  panel.innerHTML = `<div class="pmeta"><span class="pdate">${it.full}</span><span class="pconf">${it.conf} confidence</span><span class="psrc">${it.src}</span></div>
    <h2>${it.h}</h2><div class="pbody">${it.body}</div><div class="pwhy">Why it matters — ${it.why}</div>`;
}

/* Keep the timeline drawn through the measured icon centers at any width. */
const layout = () => {
  const tr = track.getBoundingClientRect();
  const pic = nodes[0].querySelector('.tpic').getBoundingClientRect();
  const y = pic.top - tr.top + pic.height / 2 - 1;
  line.style.top = y + 'px';
  fill.style.top = y + 'px';
};

/* The sweep replays the month: the fill line grows left to right and each
   release ignites in date order, stepping the panel, ending on the newest
   item (the original default selection). rAF t0 comes from the first frame
   timestamp, never performance.now(): sandboxed iframes can disagree
   between the two clocks. */
const DWELL = 620;
let raf = 0;
const run = () => {
  cancelAnimationFrame(raf);
  layout();
  nodes.forEach((n) => n.classList.remove('lit'));
  if (reduced) { fill.style.transform = 'scaleX(1)'; nodes.forEach((n) => n.classList.add('lit')); sel(ITEMS.length - 1); return; }
  const tr = track.getBoundingClientRect();
  const lr = line.getBoundingClientRect();
  const stops = nodes.map((n) => {
    const r = n.querySelector('.tpic').getBoundingClientRect();
    return Math.min(1, Math.max(0, (r.left + r.width / 2 - lr.left) / lr.width));
  });
  const total = DWELL * stops.length;
  let t0 = null, litCount = 0;
  const step = (ts) => {
    if (t0 === null) t0 = ts;
    const t = ts - t0;
    const i = Math.min(stops.length - 1, Math.floor(t / DWELL));
    const f = Math.min(1, (t - i * DWELL) / DWELL);
    const from = i === 0 ? 0 : stops[i - 1];
    const p = from + (stops[i] - from) * f;
    fill.style.transform = 'scaleX(' + p + ')';
    for (let k = 0; k < stops.length; k++) {
      if (p >= stops[k] - 0.005 && !nodes[k].classList.contains('lit')) {
        nodes[k].classList.add('lit'); sel(k);
      }
    }
    if (t < total) { raf = requestAnimationFrame(step); }
  };
  raf = requestAnimationFrame(step);
};

document.getElementById('replay').addEventListener('click', run);
sel(ITEMS.length - 1);
layout();
window.addEventListener('resize', layout);

/* threshold 0, not 0.2: the figure can exceed a phone viewport, and a
   fraction of a too-tall element never intersects. */
if ('IntersectionObserver' in window) {
  const io = new IntersectionObserver((entries) => {
    if (entries.some((e) => e.isIntersecting)) { io.disconnect(); run(); }
  }, { threshold: 0 });
  io.observe(track);
} else { run(); }

if (document.documentElement.dataset.embedded === 'true') {
  const postSize = () => window.parent.postMessage({ type: 'm2m:frame-size', height: document.body.scrollHeight }, '*');
  if ('ResizeObserver' in window) new ResizeObserver(postSize).observe(document.body);
  window.addEventListener('load', postSize);
}
})();
</script>
</body>
</html>
