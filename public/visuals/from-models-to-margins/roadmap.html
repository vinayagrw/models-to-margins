<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The build roadmap — watch the pyramid light up, phase by phase</title>
<script src="./_theme-bootstrap.js"></script>
<link rel="stylesheet" href="./_theme.css">
<style>
:root[data-embedded="true"], :root[data-embedded="true"] body { height: auto; }
.shell { display: flex; flex-direction: column; gap: clamp(9px,1.6vh,15px); justify-content: center; }
.head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.head h1 { font-size: clamp(1.05rem,2vw,1.5rem); font-weight: 700; letter-spacing: -0.02em; color: var(--text-strong); }
.head p { color: var(--muted); font-size: 0.8rem; }

.ctl { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ctl button {
  min-height: 32px; padding: 5px 12px; cursor: pointer; border-radius: 7px;
  font-size: 0.64rem; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase;
  color: var(--accent); background: transparent; border: 1px solid var(--accent);
}
.ctl button:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.ctl button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ctl .hint { font-size: 0.68rem; color: var(--muted-soft); }

/* stepper rail: each phase is an icon station, a token walks the line between them */
.rail { position: relative; display: grid; grid-template-columns: repeat(4,1fr); gap: 6px; }
.rail::before { content: ""; position: absolute; left: 7%; right: 7%; top: 14px; height: 3px; border-radius: 2px;
  background: var(--border-strong); z-index: 0; }
.railfill { position: absolute; left: 7%; top: 14px; height: 3px; border-radius: 2px; z-index: 0;
  background: linear-gradient(90deg, var(--accent), var(--accent-3)); transition: width .35s cubic-bezier(.4,.1,.2,1); }
.tok { position: absolute; top: 15.5px; left: 7%; width: 12px; height: 12px; border-radius: 50%; z-index: 2;
  background: var(--accent); box-shadow: 0 0 8px color-mix(in srgb, var(--accent) 70%, transparent);
  transform: translate(-50%,-50%); opacity: 0; pointer-events: none; }
.step { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;
  background: none; border: none; font: inherit; cursor: pointer; padding: 0; text-align: center; min-width: 0; }
.dot { position: relative; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center;
  background: var(--surface); border: 2px solid var(--border-strong); color: var(--muted); transition: all .2s ease; }
.dot .ic svg { width: 18px; height: 18px; display: block; }
.dot .ic svg * { stroke: currentColor; }
.dot .num { position: absolute; top: -5px; right: -7px; width: 15px; height: 15px; border-radius: 50%;
  display: grid; place-items: center; font-size: 0.56rem; font-weight: 800;
  background: var(--surface-strong); border: 1px solid var(--border-strong); color: var(--muted); }
.step .lab { font-size: 0.67rem; font-weight: 600; color: var(--muted); line-height: 1.25; max-width: 13ch; }
.step:hover .dot { border-color: var(--accent); color: var(--text); }
.step.done .dot { color: var(--accent); border-color: var(--accent); }
.step.done .dot .num { color: var(--accent); border-color: var(--accent); }
.step[aria-selected="true"] .dot { box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 30%, transparent);
  border-color: var(--accent); color: var(--accent); transform: scale(1.08); }
.step[aria-selected="true"] .lab { color: var(--text-strong); }
.step:focus-visible .dot { outline: 2px solid var(--accent); outline-offset: 2px; }

.body { display: grid; grid-template-columns: minmax(150px,0.62fr) minmax(0,1fr); gap: clamp(12px,2vw,22px); align-items: center; }

/* mini pyramid: each layer keeps its category colour and carries its own pictogram */
.pyr { display: flex; flex-direction: column; gap: 5px; }
.layer { position: relative; height: 30px; border-radius: 7px; display: flex; align-items: center; gap: 6px; padding: 0 10px; margin: 0 auto;
  font-size: 0.66rem; font-weight: 700; letter-spacing: 0.02em; transition: all .35s ease; overflow: hidden; white-space: nowrap; }
.layer .lic { flex: none; display: grid; place-items: center; }
.layer .lic svg { width: 15px; height: 15px; display: block; }
.layer .lic svg * { stroke: currentColor; }
.layer .tag { position: relative; z-index: 1; overflow: hidden; text-overflow: ellipsis; }
.layer .st { position: relative; z-index: 1; margin-left: auto; font-size: 0.56rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; opacity: 0.85; }
.l0 { width: 56%; } .l1 { width: 67%; } .l2 { width: 78%; } .l3 { width: 89%; } .l4 { width: 100%; }
/* states: solid = measured, asserted = on the board but only asserted, off = not yet */
.layer.off { background: color-mix(in srgb, var(--border) 60%, transparent); color: var(--muted-soft); border: 1px dashed var(--border-strong); }
.layer.asserted { background: color-mix(in srgb, var(--c) 14%, transparent); color: var(--text); border: 1px dashed color-mix(in srgb, var(--c) 70%, transparent); }
.layer.solid { background: color-mix(in srgb, var(--c) 24%, transparent); color: var(--text-strong);
  border: 1px solid var(--c); box-shadow: var(--shadow-soft); }
.layer.solid .lic { color: var(--c); }

/* detail panel */
.panel { border-radius: 14px; border: 1px solid var(--border); background: var(--surface); box-shadow: var(--shadow-soft); padding: 13px 15px; }
.ptitle { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 9px; }
.ptitle .pn { font-size: 0.78rem; font-weight: 800; color: var(--accent); }
.ptitle .pname { font-size: 1rem; font-weight: 700; color: var(--text-strong); }
.gets { margin-top: 9px; display: grid; gap: 5px; }
.gets .g { display: flex; gap: 7px; font-size: 0.82rem; color: var(--text); line-height: 1.4; align-items: flex-start; }
.gets .g .ic { color: var(--good); flex: none; margin-top: 2px; }
.gets .g .ic svg, .miss .ic svg { width: 14px; height: 14px; display: block; }
.gets .g .ic svg *, .miss .ic svg * { stroke: currentColor; }
.gets .g b { color: var(--text-strong); }
.miss { margin-top: 10px; padding-top: 9px; border-top: 1px dashed var(--border-strong); font-size: 0.81rem; color: var(--muted); line-height: 1.42; display: flex; gap: 7px; align-items: flex-start; }
.miss .ic { color: var(--warn); flex: none; margin-top: 2px; }
.miss b { color: var(--text); }
@media (max-width: 600px){
  .body { grid-template-columns: 1fr; }
  .pyr { max-width: 280px; margin: 0 auto; width: 100%; }
  .step .lab { font-size: 0.6rem; max-width: 100%; }
}
@media (prefers-reduced-motion: reduce){
  .railfill, .dot, .layer, .step[aria-selected="true"] .dot { transition: none !important; }
  .tok { display: none; }
}
</style>
</head>
<body>
<main class="shell">
  <div class="head">
    <h1>The build, phase by phase.</h1>
    <p>Each phase buys something — and pointedly does <em>not</em> buy the next. Pick a phase; watch the pyramid light up.</p>
  </div>

  <div class="ctl">
    <button type="button" id="replay">Replay build</button>
    <span class="hint">The token walks the four phases. Tap a phase for what it buys.</span>
  </div>

  <div class="rail" id="rail" role="tablist" aria-label="Build phases">
    <div class="railfill" id="railfill" style="width:0"></div>
    <div class="tok" id="tok" aria-hidden="true"></div>
  </div>

  <div class="body">
    <div class="pyr" id="pyr" aria-hidden="true"></div>
    <div class="panel" id="panel" role="tabpanel" tabindex="0" aria-live="polite"></div>
  </div>
</main>

<script>
(() => {
const ICON_BASE = '../customs-entry-agent/flow-icons/';
const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* Shared line-art icons, fetched once and inlined with the stroke swapped to
   currentColor so each slot follows its own theme colour. A failed fetch
   leaves the slot empty and the text still carries the row. */
const ICONS = {};
function icon(name){
  if (!ICONS[name]) ICONS[name] = fetch(ICON_BASE + name + '.svg')
    .then(r => r.ok ? r.text() : Promise.reject())
    .then(t => t.replace(/stroke="#232f3e"/g, 'stroke="currentColor"'))
    .catch(() => '');
  return ICONS[name];
}
function fillIcons(root){
  root.querySelectorAll('[data-ic]').forEach(slot => {
    icon(slot.dataset.ic).then(t => { slot.innerHTML = t; });
  });
}

const LAYERS = [
  { key:'biz', tag:'Business',        ic:'chart',    cls:'l0', cv:'var(--biz)' },
  { key:'ux',  tag:'User Experience', ic:'person',   cls:'l1', cv:'var(--ux)' },
  { key:'out', tag:'Model Output',    ic:'document', cls:'l2', cv:'var(--out)' },
  { key:'mod', tag:'Model',           ic:'cpu',      cls:'l3', cv:'var(--mod)' },
  { key:'sys', tag:'System',          ic:'gears',    cls:'l4', cv:'var(--sys)' },
];
// per-phase layer reach: solid = measured, asserted = on the dashboard but only asserted, off = not yet
const PHASES = [
  { n:1, name:'Substrate + cost truth', ic:'gauge',
    reach:{ sys:'solid', mod:'solid', out:'off', ux:'off', biz:'off' },
    gets:['Trustworthy <b>System / Model</b> metrics — correct percentiles, <b>cost-per-successful-task</b>, drift detection'],
    miss:'Any link to the business; any eval.' },
  { n:2, name:'Eval gate + judge calibration', ic:'scales',
    reach:{ sys:'solid', mod:'solid', out:'solid', ux:'off', biz:'off' },
    gets:['Pre-ship <b>regression protection</b>','<b>Validated judges</b> instead of vanity scores'],
    miss:'Causal business attribution.' },
  { n:3, name:'Metric tree + chain validator', ic:'split',
    reach:{ sys:'solid', mod:'solid', out:'solid', ux:'asserted', biz:'asserted' },
    gets:['“Dashboards as <b>hypotheses</b>”','<b>Chain-break</b> and <b>surrogate-paradox</b> alerts'],
    miss:'Powered causal proof (still needs traffic) — the top two layers are on the board, but only <b>asserted</b>.' },
  { n:4, name:'Experiment + confidence-gated HITL', ic:'flask',
    reach:{ sys:'solid', mod:'solid', out:'solid', ux:'solid', biz:'solid' },
    gets:['Causal <b>ship / no-ship</b> decisions','Safe automation + a <b>label flywheel</b>'],
    miss:'Nothing — this is the full vision. The whole chain is now <b>measured</b>, not asserted.' },
];

const rail = document.getElementById('rail');
const railfill = document.getElementById('railfill');
const tok = document.getElementById('tok');
const pyr = document.getElementById('pyr');
const panel = document.getElementById('panel');
let active = 0;

// build pyramid layers once
LAYERS.forEach(l => {
  const d = document.createElement('div'); d.className = 'layer ' + l.cls; d.id = 'ly-' + l.key; d.style.setProperty('--c', l.cv);
  d.innerHTML = `<span class="lic" data-ic="${l.ic}" aria-hidden="true"></span><span class="tag">${l.tag}</span><span class="st"></span>`;
  pyr.appendChild(d);
});
// build stepper
PHASES.forEach((p,i) => {
  const b = document.createElement('button'); b.className = 'step'; b.id = 'step' + i; b.dataset.i = i;
  b.setAttribute('role','tab'); b.setAttribute('aria-controls','panel'); b.tabIndex = i === active ? 0 : -1;
  b.innerHTML = `<span class="dot"><span class="ic" data-ic="${p.ic}" aria-hidden="true"></span><span class="num">${p.n}</span></span><span class="lab">${p.name}</span>`;
  b.addEventListener('click', () => { stop(); active = i; render(); });
  rail.appendChild(b);
});
fillIcons(rail); fillIcons(pyr);
rail.addEventListener('keydown', e => {
  if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
  e.preventDefault(); stop();
  active = (active + (e.key === 'ArrowRight' ? 1 : -1) + PHASES.length) % PHASES.length;
  render(); rail.querySelectorAll('.step')[active].focus();
});

function render(){
  const p = PHASES[active];
  // stepper states
  rail.querySelectorAll('.step').forEach((b,i) => {
    b.setAttribute('aria-selected', i === active ? 'true' : 'false');
    b.tabIndex = i === active ? 0 : -1;
    b.classList.toggle('done', i < active);
  });
  railfill.style.width = (active / (PHASES.length - 1)) * 86 + '%';
  // pyramid states
  const stLabel = { solid:'measured', asserted:'asserted', off:'' };
  LAYERS.forEach(l => {
    const el = document.getElementById('ly-' + l.key);
    const s = p.reach[l.key];
    el.classList.remove('solid','asserted','off'); el.classList.add(s);
    el.querySelector('.st').textContent = stLabel[s];
  });
  // detail
  panel.setAttribute('aria-labelledby','step' + active);
  panel.innerHTML = `
    <div class="ptitle"><span class="pn">Phase ${p.n}</span><span class="pname">${p.name}</span></div>
    <div class="gets">${p.gets.map(g => `<div class="g"><span class="ic" data-ic="check" aria-hidden="true"></span><span>${g}</span></div>`).join('')}</div>
    <div class="miss"><span class="ic" data-ic="warning" aria-hidden="true"></span><span><b>Still don’t have:</b> ${p.miss}</span></div>`;
  fillIcons(panel);
}

/* The token walks the rail from Phase 1 to Phase 4, and each station it
   reaches becomes the active phase, so the pyramid lights up layer by layer.
   rAF t0 comes from the first frame timestamp, never performance.now():
   sandboxed iframes can disagree between the two clocks. */
let raf = 0;
function stop(){ cancelAnimationFrame(raf); tok.style.opacity = '0'; railfill.style.transition = ''; }
function run(){
  stop();
  if (reduced) { active = PHASES.length - 1; render(); return; }
  active = 0; render();
  const railRect = rail.getBoundingClientRect();
  const centers = Array.from(rail.querySelectorAll('.step .dot')).map(d => {
    const r = d.getBoundingClientRect();
    return r.left - railRect.left + r.width / 2;
  });
  const HOLD = 750, SEG = 1000, per = HOLD + SEG;
  const total = per * (centers.length - 1) + HOLD;
  railfill.style.transition = 'none';
  tok.style.opacity = '1'; tok.style.left = centers[0] + 'px';
  let t0 = null;
  const step = (ts) => {
    if (t0 === null) t0 = ts;
    const t = ts - t0;
    const i = Math.min(centers.length - 2, Math.floor(t / per));
    const f = Math.min(1, Math.max(0, (t - i * per - HOLD) / SEG));
    const x = centers[i] + (centers[i + 1] - centers[i]) * f;
    tok.style.left = x + 'px';
    railfill.style.width = Math.max(0, x - railRect.width * 0.07) + 'px';
    let reached = 0;
    for (let k = 0; k < centers.length; k++) if (x >= centers[k] - 2) reached = k;
    if (reached !== active) { active = reached; render(); railfill.style.width = Math.max(0, x - railRect.width * 0.07) + 'px'; }
    if (t < total) { raf = requestAnimationFrame(step); }
    else { tok.style.opacity = '0'; railfill.style.transition = ''; active = centers.length - 1; render(); }
  };
  raf = requestAnimationFrame(step);
}

document.getElementById('replay').addEventListener('click', run);

/* threshold 0, not 0.2: the figure can exceed a phone viewport, and a
   fraction of a too-tall element never intersects. */
if ('IntersectionObserver' in window) {
  const io = new IntersectionObserver((entries) => {
    if (entries.some(e => e.isIntersecting)) { io.disconnect(); run(); }
  }, { threshold: 0 });
  io.observe(rail);
} else { run(); }

if (document.documentElement.dataset.embedded === 'true') {
  const postSize = () => window.parent.postMessage({ type: 'm2m:frame-size', height: document.body.scrollHeight }, '*');
  if ('ResizeObserver' in window) new ResizeObserver(postSize).observe(document.body);
  window.addEventListener('load', postSize);
}
})();
</script>
</body>
</html>
