<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Three things the platform enforces by construction</title>
<script src="./_theme-bootstrap.js"></script>
<link rel="stylesheet" href="./_theme.css">
<style>
:root[data-embedded="true"], :root[data-embedded="true"] body { height: auto; }
.shell { display: flex; flex-direction: column; gap: clamp(8px,1.4vh,13px); }
.head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.head h1 { font-size: clamp(1.05rem,2vw,1.5rem); font-weight: 700; letter-spacing: -0.02em; color: var(--text-strong); }
.head p { color: var(--muted); font-size: 0.8rem; }

.ctl { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ctl button {
  min-height: 32px; padding: 5px 12px; cursor: pointer; border-radius: 8px;
  font-size: 0.66rem; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase;
  color: var(--accent); background: transparent; border: 1px solid var(--accent);
}
.ctl button:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.ctl .hint { font-size: 0.7rem; color: var(--muted-soft); }

.stack { display: flex; flex-direction: column; gap: 8px; }
.rule { border-radius: 13px; border: 1px solid var(--border); background: var(--surface); box-shadow: var(--shadow-soft); overflow: hidden;
  opacity: 0; transform: translateY(8px); transition: opacity 360ms ease, transform 360ms ease, border-color 360ms; }
.rule.lit { opacity: 1; transform: none; }
.rbtn { width: 100%; font: inherit; cursor: pointer; background: none; border: none; text-align: left; padding: 11px 14px; display: flex; align-items: center; gap: 11px; color: var(--text); }
.rbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

/* icon tile leads the row, the tiny numeral only orders it */
.pic { flex: none; width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center;
  background: color-mix(in srgb, var(--accent) 8%, transparent); border: 1.5px solid var(--border-strong);
  color: var(--muted); transition: color 320ms, border-color 320ms, box-shadow 320ms; }
.pic svg { width: 21px; height: 21px; display: block; }
.pic svg * { stroke: currentColor; }
.rule.lit .pic { color: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent); }
.rnum { flex: none; font-size: 0.62rem; font-weight: 800; color: var(--muted-soft); }
.rname { font-size: 0.92rem; font-weight: 700; color: var(--text-strong); flex: 1; min-width: 0; }
.chev { flex: none; color: var(--muted); transition: transform .22s ease; }
.rule[aria-expanded="true"] .chev { transform: rotate(180deg); }
.rule[aria-expanded="true"] .rbtn { border-bottom: 1px solid var(--border); }

.detail { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .26s ease; }
.detail > div { overflow: hidden; }
.rule[aria-expanded="true"] .detail { grid-template-rows: 1fr; }
.dpad { padding: 11px 14px 13px; display: grid; gap: 9px; }
.line { display: flex; gap: 10px; font-size: 0.82rem; line-height: 1.42; align-items: flex-start; }
.line .lic { flex: none; width: 22px; height: 22px; margin-top: 1px; display: grid; place-items: center; }
.line .lic svg { width: 18px; height: 18px; display: block; }
.line .lic svg * { stroke: currentColor; }
.line.bad .lic { color: var(--warn); } .line.good .lic { color: var(--good); }
.line .k { font-size: 0.58rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.07em; display: block; margin-bottom: 1px; }
.line.bad .k { color: var(--warn); } .line.good .k { color: var(--good); }
.line .body { color: var(--text); min-width: 0; } .line .body b { color: var(--text-strong); }
.line.good { padding-top: 9px; border-top: 1px dashed var(--border-strong); }

@media (max-width: 620px) {
  .rbtn { gap: 9px; padding: 10px 11px; }
  .dpad { padding: 10px 11px 12px; }
}
@media (prefers-reduced-motion: reduce){
  .detail, .chev, .rule, .pic { transition: none !important; }
  .rule { opacity: 1; transform: none; }
}
</style>
</head>
<body>
<main class="shell">
  <div class="head">
    <h1>Three rules, enforced by construction.</h1>
    <p>So a dashboard physically <em>cannot</em> get them wrong. Open a card to see the trap it kills.</p>
  </div>
  <div class="ctl">
    <button type="button" id="replay">Replay reveal</button>
    <span class="hint">Tap a rule to open the trap it kills.</span>
  </div>
  <div class="stack" id="stack"></div>
</main>

<script>
(() => {
const ICON_BASE = '../customs-entry-agent/flow-icons/';
const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const RULES = [
  { n:1, icon:'flask', name:'Store the right statistical object',
    bad:'A <b>mean of percentiles</b> — <code>avg(p99)</code> across shards. It is not a percentile of anything; it just looks like a number.',
    good:'Rates → pool raw counts, report <b>Wilson intervals</b>. Percentiles → keep a <b>mergeable sketch</b>, merge then read. Ratios like cost-per-task → <b>delta-method</b> variance (it clusters by user).' },
  { n:2, icon:'coin', name:'Cost is per *successful* task',
    bad:'<b>Cost per request.</b> A cheaper model that fails more burns tokens for no value — and looks cheaper on this metric.',
    good:'Price input &amp; output <b>apart</b> (output runs ~5–6× input), credit <b>cache-read discounts</b> (~90% on current frontier providers), and roll <b>cost-per-successful-task</b> up to contribution margin — the literal models-to-margins link.' },
  { n:3, icon:'gears', name:'Attribute to the harness, not the model',
    bad:'“<b>The model scores 62%</b>” — as if the number belonged to the model alone.',
    good:'A fixed model swings <b>~10–20 points</b> across agent harnesses; report every metric as <b>(model × harness × tools × retry)</b> and keep agent metrics <b>trajectory-aware</b>.' },
];

/* Icons are shared line-art SVGs, fetched and inlined with the stroke swapped
   to currentColor so they follow the theme. A failed fetch leaves the slot
   empty and the text still carries the row. */
const loadIcon = (slot, name) => {
  fetch(ICON_BASE + name + '.svg')
    .then((r) => (r.ok ? r.text() : Promise.reject()))
    .then((t) => { slot.innerHTML = t.replace(/stroke="#232f3e"/g, 'stroke="currentColor"'); })
    .catch(() => {});
};

const stack = document.getElementById('stack');
RULES.forEach((r,i)=>{
  const el=document.createElement('div'); el.className='rule'; el.setAttribute('aria-expanded', i===0?'true':'false');
  el.innerHTML = `
    <button class="rbtn" aria-expanded="${i===0?'true':'false'}" aria-controls="d${i}">
      <span class="pic" data-pic aria-hidden="true"></span>
      <span class="rname">${r.name.replace(/\*(.+?)\*/g,'<em>$1</em>')}</span>
      <span class="rnum" aria-hidden="true">0${r.n}</span>
      <svg class="chev" width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="detail" id="d${i}"><div><div class="dpad">
      <div class="line bad"><span class="lic" data-lic="warning" aria-hidden="true"></span><span class="body"><span class="k">The trap</span>${r.bad}</span></div>
      <div class="line good"><span class="lic" data-lic="check" aria-hidden="true"></span><span class="body"><span class="k">Enforced instead</span>${r.good}</span></div>
    </div></div></div>`;
  loadIcon(el.querySelector('[data-pic]'), r.icon);
  el.querySelectorAll('[data-lic]').forEach((s)=>loadIcon(s, s.dataset.lic));
  const btn = el.querySelector('.rbtn');
  btn.addEventListener('click', ()=>{
    const open = el.getAttribute('aria-expanded')==='true';
    // single-open accordion: collapse every card, then open this one if it was closed.
    stack.querySelectorAll('.rule').forEach(x=>{
      x.setAttribute('aria-expanded','false');
      x.querySelector('.rbtn').setAttribute('aria-expanded','false');
    });
    if (!open){ el.setAttribute('aria-expanded','true'); btn.setAttribute('aria-expanded','true'); }
  });
  stack.appendChild(el);
});
const cards = Array.from(stack.querySelectorAll('.rule'));

/* Staged reveal: each rule fades up and its icon lights in sequence. rAF t0
   comes from the first frame timestamp, never performance.now(): sandboxed
   iframes can disagree between the two clocks. */
const DWELL = 420;
let raf = 0;
const run = () => {
  cancelAnimationFrame(raf);
  if (reduced) { cards.forEach((c) => c.classList.add('lit')); return; }
  cards.forEach((c) => c.classList.remove('lit'));
  let t0 = null;
  const step = (ts) => {
    if (t0 === null) t0 = ts;
    const t = ts - t0;
    cards.forEach((c, i) => { if (t >= i * DWELL) c.classList.add('lit'); });
    if (t < DWELL * cards.length) raf = requestAnimationFrame(step);
  };
  raf = requestAnimationFrame(step);
};

document.getElementById('replay').addEventListener('click', run);

/* threshold 0, not 0.2: the stack can exceed a phone viewport, and a fraction
   of a too-tall element never intersects. */
if ('IntersectionObserver' in window) {
  const io = new IntersectionObserver((entries) => {
    if (entries.some((e) => e.isIntersecting)) { io.disconnect(); run(); }
  }, { threshold: 0 });
  io.observe(stack);
} else { run(); }

if (document.documentElement.dataset.embedded === 'true') {
  const postSize = () => window.parent.postMessage({ type: 'm2m:frame-size', height: document.body.scrollHeight }, '*');
  if ('ResizeObserver' in window) new ResizeObserver(postSize).observe(document.body);
  window.addEventListener('load', postSize);
}
})();
</script>
</body>
</html>
