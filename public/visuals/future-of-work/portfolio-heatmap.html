<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio Heatmap — Future of Work</title>
  <script>
    (() => {
      const params = new URLSearchParams(window.location.search);
      const storageKey = 'm2m-theme';
      const root = document.documentElement;
      const media = window.matchMedia('(prefers-color-scheme: dark)');
      const normalizeTheme = (v) => v === 'dark' || v === 'light' ? v : null;
      const getStoredTheme = () => { try { return normalizeTheme(localStorage.getItem(storageKey)); } catch { return null; } };
      const getSystemTheme = () => media.matches ? 'dark' : 'light';
      const getPreferredTheme = () => normalizeTheme(params.get('theme')) ?? getStoredTheme() ?? 'dark';
      root.dataset.embedded = params.get('embed') === '1' ? 'true' : 'false';
      window.__m2mApplyTheme = (theme, persist = false) => {
        const next = normalizeTheme(theme) ?? getPreferredTheme();
        root.dataset.theme = next;
        root.style.colorScheme = next;
        if (persist) try { localStorage.setItem(storageKey, next); } catch {}
        if (typeof window.__rebuild === 'function') window.__rebuild();
      };
      window.__m2mApplyTheme(getPreferredTheme(), false);
      window.addEventListener('message', (e) => {
        if (e.origin !== location.origin) return;
        if (e.data?.type === 'm2m:set-theme') window.__m2mApplyTheme(e.data.theme, false);
      });
      const sync = (e) => { if (!getStoredTheme()) window.__m2mApplyTheme(e.matches ? 'dark' : 'light', false); };
      media.addEventListener?.('change', sync) ?? media.addListener?.(sync);
    })();
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root, :root[data-theme="light"] {
      color-scheme: light;
      --bg: #f4f1ec; --text: #1a1a2e; --muted: #6b7280;
      --cell-bg: rgba(0,0,0,0.03); --header-bg: rgba(0,0,0,0.05);
      --tooltip-bg: rgba(255,255,255,0.97); --tooltip-border: rgba(0,0,0,0.1);
      --tooltip-shadow: 0 8px 32px rgba(0,0,0,0.14);
      --arrow-color: rgba(0,0,0,0.25);
      --accent: #2563eb;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0b1120; --text: #e2e8f0; --muted: #94a3b8;
      --cell-bg: rgba(255,255,255,0.03); --header-bg: rgba(255,255,255,0.05);
      --tooltip-bg: rgba(15,23,42,0.97); --tooltip-border: rgba(255,255,255,0.1);
      --tooltip-shadow: 0 8px 32px rgba(0,0,0,0.5);
      --arrow-color: rgba(255,255,255,0.2);
      --accent: #60a5fa;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --bg: #0b1120; --text: #e2e8f0; --muted: #94a3b8;
        --cell-bg: rgba(255,255,255,0.03); --header-bg: rgba(255,255,255,0.05);
        --tooltip-bg: rgba(15,23,42,0.97); --tooltip-border: rgba(255,255,255,0.1);
        --tooltip-shadow: 0 8px 32px rgba(0,0,0,0.5);
        --arrow-color: rgba(255,255,255,0.2);
        --accent: #60a5fa;
      }
    }
    :root[data-embedded="true"], :root[data-embedded="true"] body { height: auto; }
    html, body { width: 100%; background: var(--bg); font-family: system-ui, -apple-system, sans-serif; color: var(--text); }
    html[data-embedded="true"] body { background: transparent; }

    .wrap { padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 10px; }
    .ctl { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .ctl button {
      min-height: 32px; padding: 5px 12px; cursor: pointer; border-radius: 8px;
      font: 600 11px/1 system-ui, sans-serif; letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--accent); background: transparent; border: 1px solid var(--accent);
    }
    .ctl button:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
    .ctl .hint { font-size: 11px; color: var(--muted); }

    .grid { display: grid; grid-template-columns: clamp(72px, 26vw, 140px) 1fr 20px 1fr 20px 1fr; gap: 4px; width: 100%; align-items: stretch; }
    .row-excluded { opacity: 0.35; }
    .row-excluded .row-label { border: 1px dashed var(--arrow-color); background: transparent; font-style: italic; }
    .cell.excluded { border: 1px dashed var(--arrow-color); }

    .header { display: flex; align-items: center; justify-content: center; min-height: 30px; font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); background: var(--header-bg); border-radius: 8px; }
    .arrow-col { display: flex; align-items: center; justify-content: center; }
    .arrow-col svg { width: 16px; height: 16px; }

    .row-label { display: flex; align-items: center; gap: 7px; padding: 4px 8px; font-size: 12px; font-weight: 600; color: var(--text); border-radius: 10px; background: var(--cell-bg); min-width: 0; }
    .row-label .pic { width: 20px; height: 20px; flex-shrink: 0; display: grid; place-items: center; }
    .row-label .pic svg { width: 20px; height: 20px; display: block; }
    .row-label .pic svg * { stroke: currentColor; }
    .row-label .lbl { min-width: 0; overflow-wrap: anywhere; }

    .cell {
      border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 2px; cursor: pointer; min-height: 54px; padding: 4px 2px;
      border: 1px solid transparent; font-family: inherit; text-align: center;
      transition: transform 150ms ease, box-shadow 150ms ease;
    }
    .cell:hover { transform: scale(1.04); z-index: 2; box-shadow: var(--tooltip-shadow); }
    .cell:focus-visible, .cell[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: 1px; }
    .cell .rank { font-size: 22px; font-weight: 800; color: #fff; line-height: 1; }
    .cell .meta { font-size: 9px; font-weight: 500; color: rgba(255,255,255,0.8); letter-spacing: 0.04em; }

    /* staged stamp-in: heat opacity lives in --o so the reveal class can own opacity */
    .stampable { opacity: 0; transform: scale(0.82); transition: opacity 300ms ease, transform 300ms cubic-bezier(0.2, 1.4, 0.4, 1); }
    .stampable.in { opacity: var(--o, 1); transform: none; }
    .stampable.in:hover { transform: scale(1.04); }

    .panel {
      border: 1px solid var(--tooltip-border); border-left: 3px solid var(--accent); border-radius: 10px;
      background: var(--tooltip-bg); padding: 10px 14px; font-size: 11px; line-height: 1.45; color: var(--text);
      min-height: 58px;
    }
    .panel strong { display: block; margin-bottom: 3px; font-size: 12px; }
    .panel .tt-why { color: var(--muted); margin-top: 4px; font-style: italic; }
    .panel .empty { color: var(--muted); }

    @media (max-width: 500px) {
      .wrap { padding: 8px; }
      .grid { grid-template-columns: clamp(64px, 24vw, 90px) 1fr 14px 1fr 14px 1fr; }
      .row-label { font-size: 10px; padding: 3px 5px; gap: 5px; }
      .row-label .pic, .row-label .pic svg { width: 16px; height: 16px; }
      .cell { min-height: 44px; }
      .cell .rank { font-size: 16px; }
      .cell .meta { font-size: 8px; }
      .arrow-col svg { width: 12px; height: 12px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .stampable { transition: none; }
      .cell, .cell:hover, .stampable.in:hover { transition: none; transform: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="ctl">
      <button type="button" id="replay">Replay</button>
      <span class="hint">Deeper color and lower number mean a higher rank. Tap a cell to pin its detail below.</span>
    </div>
    <div class="grid" id="grid"></div>
    <div class="panel" id="panel" aria-live="polite"><span class="empty">Tap any cell to pin its rank, score, grade and confidence here.</span></div>
  </div>
  <script>
    const SECTORS = [
      { id: 'healthcare', label: 'Healthcare', icon: 'person', color: { light: '#16825d', dark: '#22c07a' },
        ranks: [1,3,3], scores: [4.8,4.2,4.1], grades: ['A','B','B'], conf: ['High','High','High'],
        why: 'Demand is demographic and durable, but long-term value shifts toward specialized and tech-enabled roles.' },
      { id: 'ai', label: 'AI Infrastructure', icon: 'cpu', color: { light: '#2563eb', dark: '#60a5fa' },
        ranks: [2,1,5], scores: [4.7,4.8,3.8], grades: ['A','B','B'], conf: ['High','High','Medium'],
        why: 'Stays large, but durable value moves toward infrastructure, economics, and domain integration.' },
      { id: 'cyber', label: 'Cybersecurity', icon: 'shield', color: { light: '#7c3aed', dark: '#a78bfa' },
        ranks: [3,4,4], scores: [4.1,4.0,3.9], grades: ['A','B','A'], conf: ['High','High','High'],
        why: 'Security remains mandatory, but routine work automates faster than trust-heavy architecture.' },
      { id: 'grid_elec', label: 'Electrification', icon: 'transmit', color: { light: '#b8860b', dark: '#fbbf24' },
        ranks: [4,2,1], scores: [4.0,4.6,4.9], grades: ['A','A','A'], conf: ['High','High','High'],
        why: 'Power rises because it becomes a prerequisite constraint on AI, industry, buildings, and transport.' },
      { id: 'mfg', label: 'Manufacturing', icon: 'factory', color: { light: '#be185d', dark: '#f472b6' },
        ranks: [5,5,2], scores: [3.9,4.0,4.5], grades: ['B','B','B'], conf: ['Medium','Medium','High'],
        why: 'Starts narrower, then rises as domestic production and robotics become strategic constraints.' },
      // Excluded sector — rendered dimmed to show it was evaluated
      { id: 'finance', label: 'Finance', icon: 'coin', color: { light: '#94a3b8', dark: '#64748b' },
        ranks: [6,6,6], scores: [2.8,2.6,2.4], grades: ['C','C','C'], conf: ['Medium','Low','Low'],
        why: 'Net job losses (-77K). Highest AI displacement risk of any knowledge sector. Durable niches exist in RegTech and compliance architecture.', excluded: true }
    ];
    const HORIZONS = ['1-2 yr','3-5 yr','5-10 yr'];

    /* Icons are the shared line-art set, fetched once and inlined with the
       stroke swapped to currentColor. A failed fetch leaves the slot empty
       and the sector label still carries the row. */
    const ICON_BASE = '../customs-entry-agent/flow-icons/';
    const ICONS = {};
    SECTORS.forEach((s) => {
      fetch(ICON_BASE + s.icon + '.svg')
        .then((r) => (r.ok ? r.text() : Promise.reject()))
        .then((t) => {
          ICONS[s.id] = t.replace(/stroke="#232f3e"/g, 'stroke="currentColor"');
          document.querySelectorAll(`[data-pic="${s.id}"]`).forEach((el) => { el.innerHTML = ICONS[s.id]; });
        })
        .catch(() => {});
    });

    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let played = false;
    let selected = null; // { si, hi }

    function isDark() { return document.documentElement.dataset.theme === 'dark' || (!document.documentElement.dataset.theme && window.matchMedia('(prefers-color-scheme: dark)').matches); }

    function rankOpacity(r) { return 1.0 - (r - 1) * 0.16; }

    function arrowSvg(from, to) {
      if (from === to) return `<svg viewBox="0 0 16 16"><line x1="2" y1="8" x2="14" y2="8" stroke="var(--arrow-color)" stroke-width="1.5" stroke-dasharray="3 2"/></svg>`;
      const up = to < from;
      return `<svg viewBox="0 0 16 16"><path d="${up ? 'M8 14V4M4 7l4-4 4 4' : 'M8 2v10M4 9l4 4 4-4'}" fill="none" stroke="var(--arrow-color)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    }

    function showDetail(si, hi) {
      const s = SECTORS[si];
      document.getElementById('panel').innerHTML = `
        <strong>${s.label} — ${HORIZONS[hi]}</strong>
        Rank ${s.excluded ? '—' : '#' + s.ranks[hi]} &middot; Score ${s.scores[hi]} &middot; Grade ${s.grades[hi]} &middot; ${s.conf[hi]} confidence
        <div class="tt-why">${s.why}</div>`;
    }

    window.__rebuild = function() {
      const dark = isDark();
      const g = document.getElementById('grid');
      let html = `<div class="header" style="grid-column:1;grid-row:1"></div>`;
      // horizon headers (col 2, skip arrow col 3, col 4, skip 5, col 6)
      html += `<div class="header" style="grid-column:2">${HORIZONS[0]}</div>`;
      html += `<div class="arrow-col" style="grid-column:3;grid-row:1"></div>`;
      html += `<div class="header" style="grid-column:4">${HORIZONS[1]}</div>`;
      html += `<div class="arrow-col" style="grid-column:5;grid-row:1"></div>`;
      html += `<div class="header" style="grid-column:6">${HORIZONS[2]}</div>`;

      SECTORS.forEach((s, si) => {
        const row = si + 2;
        const c = dark ? s.color.dark : s.color.light;
        const excl = s.excluded ? ' row-excluded' : '';
        html += `<div class="row-label${excl}" style="grid-row:${row};color:${c}"><span class="pic" data-pic="${s.id}" aria-hidden="true">${ICONS[s.id] || ''}</span><span class="lbl" style="color:var(--text)">${s.label}${s.excluded ? ' <span style="font-size:9px;opacity:0.6">(excluded)</span>' : ''}</span></div>`;
        for (let hi = 0; hi < 3; hi++) {
          const col = hi * 2 + 2; // cols 2, 4, 6
          const op = s.excluded ? 0.3 : rankOpacity(s.ranks[hi]);
          const pressed = selected && selected.si === si && selected.hi === hi;
          html += `<button type="button" class="cell stampable${s.excluded ? ' excluded' : ''}" data-si="${si}" data-hi="${hi}" aria-pressed="${pressed ? 'true' : 'false'}"
            aria-label="${s.label} ${HORIZONS[hi]}, rank ${s.excluded ? 'excluded' : s.ranks[hi]}, score ${s.scores[hi]}, grade ${s.grades[hi]}, ${s.conf[hi]} confidence"
            style="grid-row:${row};grid-column:${col};background:color-mix(in srgb, ${c} ${Math.round(op*100)}%, var(--cell-bg));--o:${s.excluded ? 0.4 : 0.55 + op*0.45}">
            <span class="rank">${s.excluded ? '—' : '#' + s.ranks[hi]}</span>
            <span class="meta">${s.scores[hi]} / ${s.grades[hi]} / ${s.conf[hi]}</span>
          </button>`;
          // arrow between columns
          if (hi < 2) {
            const arrowCol = hi * 2 + 3; // cols 3, 5
            html += `<div class="arrow-col stampable" style="grid-row:${row};grid-column:${arrowCol}">${arrowSvg(s.ranks[hi], s.ranks[hi+1])}</div>`;
          }
        }
      });
      g.innerHTML = html;
      g.querySelectorAll('.cell').forEach((btn) => {
        btn.addEventListener('click', () => {
          const si = Number(btn.dataset.si), hi = Number(btn.dataset.hi);
          g.querySelectorAll('.cell[aria-pressed="true"]').forEach((b) => b.setAttribute('aria-pressed', 'false'));
          btn.setAttribute('aria-pressed', 'true');
          selected = { si, hi };
          showDetail(si, hi);
        });
      });
      // a theme rebuild mid- or post-animation jumps to the fully revealed state
      if (played) g.querySelectorAll('.stampable').forEach((el) => el.classList.add('in'));
    };
    window.__rebuild();

    /* Staged stamp-in: each cell (and the trend arrow after it) lands in
       reading order. rAF t0 comes from the first frame timestamp, never
       performance.now(): sandboxed iframes can disagree between the two clocks. */
    const STEP = 70;
    let raf = 0;
    function run() {
      cancelAnimationFrame(raf);
      const initial = Array.from(document.querySelectorAll('.stampable'));
      initial.forEach((el) => el.classList.remove('in'));
      if (reduced) { initial.forEach((el) => el.classList.add('in')); played = true; return; }
      played = false;
      let t0 = null;
      const step = (ts) => {
        if (t0 === null) t0 = ts;
        // re-query each frame so a theme rebuild mid-animation still reveals the fresh nodes
        const items = Array.from(document.querySelectorAll('.stampable'));
        const i = Math.min(items.length - 1, Math.floor((ts - t0) / STEP));
        for (let k = 0; k <= i; k++) items[k].classList.add('in');
        if (i < items.length - 1) { raf = requestAnimationFrame(step); }
        else { played = true; }
      };
      raf = requestAnimationFrame(step);
    }

    document.getElementById('replay').addEventListener('click', run);

    /* threshold 0, not 0.2: the grid can exceed a phone viewport, and a
       fraction of a too-tall element never intersects. */
    if ('IntersectionObserver' in window) {
      const io = new IntersectionObserver((entries) => {
        if (entries.some((e) => e.isIntersecting)) { io.disconnect(); run(); }
      }, { threshold: 0 });
      io.observe(document.getElementById('grid'));
    } else { run(); }

    if (document.documentElement.dataset.embedded === 'true') {
      const postSize = () => window.parent.postMessage({ type: 'm2m:frame-size', height: document.body.scrollHeight }, '*');
      if ('ResizeObserver' in window) new ResizeObserver(postSize).observe(document.body);
      window.addEventListener('load', postSize);
    }
  </script>
</body>
</html>
