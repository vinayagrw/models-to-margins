<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>End to end &middot; one entry travels the system</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="./_theme-bootstrap.js"></script>
<link rel="stylesheet" href="./_theme.css">
<link rel="stylesheet" href="./stencil.css">
<style>
  :root[data-embedded="true"] .head h1 { font-size: 1.02rem; }
  body { background: transparent; }
</style>
</head>
<body>
<div class="shell">
  <div class="head">
    <h1 id="h-title">End to end</h1>
    <p id="h-intro"></p>
    <div class="stampline"><span class="stamp stamp--illustrative">Illustrative walkthrough</span></div>
  </div>

  <div class="bar" id="scenbar" hidden><span class="lbl">Scenario</span></div>

  <div class="bar" id="ctlbar">
    <span class="lbl">Flow</span>
    <button id="b-play" aria-pressed="false">Play</button>
    <button id="b-all">Show all</button>
    <span class="lbl" style="margin-left:8px">View</span>
    <button id="b-fit">Fit</button>
    <button id="b-full" aria-pressed="false">Fullscreen</button>
    <span class="cam">
      <button id="b-out" aria-label="Zoom out">&minus;</button>
      <button id="b-in" aria-label="Zoom in">+</button>
    </span>
    <span class="hint" style="margin-left:6px">Drag to pan &middot; wheel or pinch to zoom</span>
  </div>

  <div class="stage" id="stage" tabindex="0" role="application" aria-label="Entry lifecycle stencil, pan and zoom">
    <div class="fsbar" id="fsbar"></div>
    <div class="world" id="world">
      <div class="diagram" id="diagram">
        <svg class="wires" id="svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" aria-hidden="true"></svg>
      </div>
    </div>
  </div>

  <div class="narr" id="narr">
    <span class="num" id="n-num">All steps</span>
    <span class="cap" id="n-cap"></span>
  </div>
  <div class="bar scrub" id="scrub"><span class="lbl">Step</span></div>

  <div class="legend" id="legend"></div>

  <div class="card" id="card" hidden>
    <button class="x" id="card-x" aria-label="Close">&times;</button>
    <h3><span class="ci" id="card-ic"></span><span id="card-nm"></span></h3>
    <div class="svc" id="card-sv"></div>
    <p id="card-ds"></p>
    <div class="where" id="card-wh"></div>
  </div>
</div>

<script>
/* ============================================================================
 * The only authored block. Everything else is the shared stencil engine.
 * ==========================================================================*/
window.STENCIL = {
  title: 'End to end &middot; one entry travels the system',
  intro: 'One topology, four journeys across it. Pick a scenario and the drawing narrows to the path that line item actually takes, then step through it. Click any stage for what it does.',
  iconBase: './flow-icons/',
  scenarioLabel: 'Scenario',
  outsideLabel: 'Runs outside the per-entry execution.',

  types: {
    flow:  { color: 'var(--ink)',      label: 'Entry data flow' },
    tier:  { color: '#8c4fff',         label: 'Novelty routing' },
    human: { color: '#7aa116',         label: 'Human decision' },
    watch: { color: 'var(--accent-2)', label: 'Rulebook watch and invalidation' }
  },

  nodes: {
    intake:    { ic: 'inbox',      sv: 'Intake',              nm: 'Documents arrive',   ds: 'Invoice, packing list and bill of lading over SES, the portal or SFTP. Every path converges on one content-addressed store before anything is read, so there is exactly one place to sandbox.' },
    parse:     { ic: 'shield',     sv: 'Quarantine',          nm: 'Sandboxed parse',    ds: 'One microVM per document, with no route out of the subnet. Prompt injection in a supplier PDF buys a dead sandbox and an alarm rather than a tool call.' },
    normalise: { ic: 'merge',      sv: 'Normalise',           nm: 'Entity resolution',  ds: 'Supplier, part number and lane resolved against the product master. This step decides how much the rest of the entry costs, because it decides which tier the line lands in.' },
    router:    { ic: 'split',      sv: 'The split',           nm: 'Novelty router',     ds: 'Deterministic code, readable in ten lines. Have we decided this exact SKU before, something near it, or nothing like it? The model is never asked to make this call.' },
    t0:        { ic: 'bookmark',   sv: 'Tier 0 &middot; 70&ndash;85%', nm: 'Recall',     ds: 'Replay a human-approved decision for an identical SKU. Zero model calls and near zero cost. The whole economic argument is that most lines land here.' },
    t1:        { ic: 'scales',     sv: 'Tier 1 &middot; 10&ndash;20%', nm: 'Deduce',     ds: 'Bounded reasoning from the nearest approved neighbour, which the model must cite. Bounded is the point: open-ended reasoning is what gets classification wrong.' },
    t2:        { ic: 'gears',      sv: 'Tier 2 &middot; 5&ndash;15%',  nm: 'Reason',     ds: 'Four specialist workers, run in parallel where the sub-decisions are independent and in sequence where they are not, because origin and program eligibility take the classification as input. Each is grounded in retrieval against the pinned rulebook.' },
    validate:  { ic: 'checklist',  sv: 'Free, deterministic', nm: 'Validator gauntlet', ds: 'Citation existence, HTS existence, arithmetic reconciliation, cross-field consistency and schema conformance. None of it needs a model, so all of it runs on every tier.' },
    gate:      { ic: 'gauge',      sv: 'The product',         nm: 'Confidence gate',    ds: 'Six fused signals, calibrated per field, with thresholds that move with materiality. Confidence quality is not portable across model families, so it is measured here rather than trusted.' },
    accept:    { ic: 'check',      sv: 'High confidence',     nm: 'Auto-accept',        ds: 'Opens only after the silent-failure rate has held under 0.5% in shadow for four consecutive weeks. Nothing auto-accepts on day one.' },
    review:    { ic: 'personcheck', sv: 'Queue',              nm: 'Broker review',      ds: 'Ranked by expected value of review, with the proposal, its nearest neighbour and the diff on one screen, and one keystroke to accept.' },
    signoff:   { ic: 'stamp',      sv: 'Mandatory',           nm: 'Licensed sign-off',  ds: 'Every Tier 2 first decision, no exceptions and regardless of score. The signature is the approval event; the ledger row it feeds, pinning the citation, corpus, rulebook version and approver, is the reasonable-care record.' },
    file:      { ic: 'transmit',   sv: 'No model inside',     nm: 'Assemble and file',  ds: '3461, 7501 and PGA records behind a hard schema gate, transmitted over ABI to CBP ACE. The component that talks to CBP contains no model and cannot improvise.' },
    ledger:    { ic: 'ledger',     sv: 'Append only',         nm: 'Audit ledger',       ds: 'A new row pinning model, prompt, corpus and rulebook versions, on six-year Object Lock compliance-mode retention that nobody can shorten. Rows are never updated. A correction is a new row that supersedes, and the old one stays forever.' },
    watcher:   { ic: 'radar',      sv: 'Always on',           nm: 'Rulebook watcher',   ds: 'Monitors the HTS, proclamations and rulings feeds, and fires the invalidation join on change. It files nothing, so it cannot mis-file anything.' }
  },

  /* Columns are the journey, rows are the concern: row 1 cheap, row 2 the
     spine, row 3 expensive, row 0 the control plane that never files. */
  layout: {
    intake: [0, 2], parse: [1, 2], normalise: [2, 2], router: [3, 2],
    t0: [4, 1], t1: [4, 2], t2: [4, 3],
    validate: [5, 2], gate: [6, 2],
    accept: [7, 1], review: [7, 2], signoff: [7, 3],
    file: [8, 2], ledger: [9, 2], watcher: [9, 0]
  },

  groups: [
    { id: 'in',    cls: 'plain',   label: 'Intake', pad: 20, head: 26, nodes: ['intake', 'normalise'], kids: ['quar'] },
    { id: 'quar',  cls: 'subnetq', label: 'Quarantine &middot; no route out', pad: 13, head: 22, nodes: ['parse'] },
    { id: 'tiers', cls: 'vpc',     label: 'Decision tiers', pad: 16, head: 24, nodes: ['t0', 't1', 't2'] },
    { id: 'chk',   cls: 'subnet',  label: 'Checks that cost nothing, then the gate', pad: 16, head: 24, nodes: ['validate', 'gate'] },
    { id: 'disp',  cls: 'account', label: 'Disposition', pad: 16, head: 24, nodes: ['accept', 'review', 'signoff'] },
    { id: 'rec',   cls: 'region',  label: 'Filing and record', pad: 16, head: 24, nodes: ['file', 'ledger'] }
  ],

  edges: [
    { f: 'intake',    t: 'parse',     ty: 'flow',  s: 1,  n: 1 },
    { f: 'parse',     t: 'normalise', ty: 'flow',  s: 2,  n: 2 },
    { f: 'normalise', t: 'router',    ty: 'flow',  s: 3,  n: 3 },
    /* Every branch owns its own steps, all the way through. A shared "and then
       the validators run" or "and then it is filed" step would light all three
       tiers, or all three routes into the filer, whichever journey the reader
       picked — a drawing that contradicts the scenario it is showing. */
    { f: 'router',    t: 't0',        ty: 'tier',  s: 4,  n: 4 },
    { f: 't0',        t: 'validate',  ty: 'flow',  s: 5,  n: 5 },
    { f: 'router',    t: 't1',        ty: 'tier',  s: 6 },
    { f: 't1',        t: 'validate',  ty: 'flow',  s: 7 },
    { f: 'router',    t: 't2',        ty: 'tier',  s: 8 },
    { f: 't2',        t: 'validate',  ty: 'flow',  s: 9 },
    { f: 'validate',  t: 'gate',      ty: 'flow',  s: 10, n: 6 },
    { f: 'gate',      t: 'accept',    ty: 'flow',  s: 11, n: 7 },
    { f: 'accept',    t: 'file',      ty: 'flow',  s: 11, n: 8 },
    { f: 'gate',      t: 'review',    ty: 'human', s: 12 },
    { f: 'review',    t: 'file',      ty: 'flow',  s: 12 },
    { f: 'gate',      t: 'signoff',   ty: 'human', s: 13 },
    { f: 'signoff',   t: 'file',      ty: 'flow',  s: 13 },
    { f: 'file',      t: 'ledger',    ty: 'flow',  s: 14, n: 9 },
    { f: 'watcher',   t: 'ledger',    ty: 'watch', s: 15, n: 10 },
    { f: 'ledger',    t: 'review',    ty: 'watch', s: 16, n: 11 },
    { f: 'review',    t: 't2',        ty: 'watch', s: 17, n: 12 }
  ],

  steps: [
    'Every document parses alone in a quarantine microVM with no route out of the subnet. A hostile PDF from a new supplier buys a dead sandbox and an alarm, which is a guarantee the subnet design makes rather than a rule the prompt asks for.',
    'Entity resolution matches supplier, part number and lane against the product master. This is the cheapest step on the page and the one that decides what everything after it costs.',
    'The split. Deterministic code, readable in ten lines: have we decided this exact SKU before, something near it, or nothing like it. Asking a model to judge its own novelty is how the 60% error rate gets in.',
    'Tier 0 replays a decision a human already approved for an identical SKU. Zero model calls. Everything about the business case depends on most lines landing here, which is why the repeat rate is the kill criterion.',
    'Even a pure recall goes through the validator gauntlet. The checks are free and deterministic, so there is no reason to skip them, and a rulebook that has moved underneath a recalled decision shows up right here.',
    'Tier 1 deduces from the nearest approved neighbour and must cite it. Bounded deduction is deliberately weaker than free reasoning, because the failure mode being avoided is a confident answer with no traceable basis.',
    'The deduction chain is checked line by line, and the neighbour the model leaned on has to exist in the pinned corpus at the version recorded. A citation nobody verifies is decoration.',
    'Tier 2 is full reasoning: four specialist workers deciding classification, valuation, origin and duty stacking, run in parallel where independent and in sequence where origin and program eligibility depend on the classification already reached, each grounded in retrieval against the pinned rulebook. Expensive, rare, and never auto-accepted.',
    'Every citation is checked against the hash-pinned rulebook version, alongside HTS existence, arithmetic reconciliation, cross-field consistency and schema conformance. A fabricated ruling number is caught by an existence check, not by a reviewer remembering.',
    'Six fused confidence signals, calibrated per field, with thresholds that move with materiality. Verbalised confidence beats logprobs on some model families and loses on others, so the gate fuses signals and measures them rather than trusting any one.',
    'Auto-accept sends the line straight to assembly with no human anywhere on its path, and that lane opens only after the silent-failure rate has held under 0.5% in shadow for four consecutive weeks. It is earned by measurement rather than switched on at launch.',
    'The gate routes to a broker with the proposal, its nearest neighbour and the diff on one screen, and one keystroke sends it on to assembly. Escalating what the system is unsure about beats asking a human to approve everything, and that gap is most of the productivity gain.',
    'A Tier 2 first decision never auto-accepts, whatever the score says. A licensed broker signs it before it reaches assembly, and that signature plus the ledger row it feeds are the reasonable-care record the statute turns on.',
    'The filing service assembles the 3461, the 7501 and the PGA records behind a hard schema gate, transmits over ABI, and writes an append-only row pinning model, prompt, corpus and rulebook versions. It contains no model at all, and its rows are never updated, because neither a filer that improvises nor a legal defence you can edit is worth having.',
    'July 20. Three Section 338 proclamations land on Canadian goods. The watcher joins the change scope against every past decision and the authorities it recorded, and finds four matches, including one whose only reason was that the goods were USMCA-qualifying.',
    'The affected decisions drop out of Tier 0 and back into the queue, flagged with the proclamation that broke them. A system that cannot invalidate its own past answers is wrong exactly when the rulebook moves, which is exactly when being wrong is expensive.',
    'Re-derivation runs as Tier 2 against the new rulebook version, then takes the same validator, gate and sign-off path as a first decision. A superseding row lands and the old row stays, marked superseded.'
  ],

  scenarios: [
    { id: 'repeat', label: 'Repeat SKU', steps: [1, 2, 3, 4, 5, 10, 11, 14],
      ds: 'A weekly shipment: same supplier, same part number, same lane. Recall, validate, auto-accept, file. No model call anywhere on this path, and it is meant to be most of the volume.' },
    { id: 'near', label: 'Near neighbour', steps: [1, 2, 3, 6, 7, 10, 12, 14],
      ds: 'A known supplier ships a new variant. No exact match, but the product master holds close neighbours, so the model deduces from one and a broker confirms in a keystroke, and the confirmed decision becomes a Tier 0 recall for the next shipment.' },
    { id: 'novel', label: 'Genuinely novel', steps: [1, 2, 3, 8, 9, 10, 13, 14],
      ds: 'A new product from a new supplier, with nothing like it on record. Full reasoning and a licensed signature, and the resulting decision seeds the product master so the next shipment is Tier 0.' },
    { id: 'rulebook', label: 'Rulebook change', steps: [15, 16, 17, 9, 10, 13, 14],
      ds: 'The loop that runs backwards. A proclamation lands, the watcher finds the decisions it invalidates, and they re-derive through the same gate and signature as a first decision.' }
  ],

  dwell: 4600,
  allLabel: 'All steps'
};
</script>
<script src="./stencil-engine.js"></script>
</body>
</html>
