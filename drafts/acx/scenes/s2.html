<section class="acx-scene" id="acx-s2" aria-labelledby="acx-s2-h">
  <header class="acx-head"><span class="acx-num">02</span><h2 id="acx-s2-h">Compare and choose</h2>
    <p class="acx-dek" data-for="leader">Describe your case to see which protocols fit and what you still have to build.</p>
    <p class="acx-dek" data-for="architect">Fit reads each protocol's own parameters. The build list comes from matching rules.</p></header>
  <div class="acx-card s2-cfg" role="group" aria-label="Your setup"></div>
  <div class="acx-split s2-split">
    <div class="acx-card s2-main">
      <div class="s2-top">
        <div class="acx-seg" role="group" aria-label="View" data-s2-view></div>
        <button type="button" class="acx-btn s2-all" aria-pressed="false"></button>
      </div>
      <p class="s2-read" aria-live="polite"></p>
      <div class="s2-view" data-v="matrix">
        <div class="s2-scroll"><div class="s2-mx" role="grid" aria-label="Protocols by parameter"></div></div>
        <div class="s2-key" aria-hidden="true"></div>
      </div>
      <div class="s2-view" data-v="arch" hidden>
        <div class="s2-zones"></div>
        <div class="s2-left"><div class="s2-lt"><p class="acx-k">Variables to set</p><span class="s2-k s2-k-dash" data-s2-evk><i></i>Evidence to record</span></div><div class="s2-tags" data-s2-vars></div></div>
        <div class="s2-crit"><div class="s2-lt"><p class="acx-k">What to weigh</p><span data-s2-cev></span></div><div class="s2-bar" role="img"></div><ol class="s2-cl"></ol><div class="s2-gates"></div></div>
      </div>
      <div class="s2-view" data-v="tree" hidden>
        <div class="s2-tree"><svg class="s2-wires" aria-hidden="true"></svg></div>
      </div>
    </div>
    <div class="acx-panel s2-side">
      <div class="acx-card s2-box s2-fits"><h3>Fits your setup</h3><div class="s2-fl"></div></div>
      <div class="acx-card s2-box s2-build"><h3>You must build</h3><div class="s2-bl"></div></div>
    </div>
  </div>
</section>
<style id="acx-s2-css">
#acx-s2 .s2-cfg{display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); gap:12px 14px; padding:14px 16px; margin:0 0 16px}

#acx-s2 .s2-f label{font-family:var(--acx-mono); font-size:14px; color:var(--acx-ink3); text-transform:uppercase; letter-spacing:.05em}
#acx-s2 .s2-sel{position:relative}
#acx-s2 .s2-sel::after{content:""; position:absolute; right:14px; top:50%; width:8px; height:8px; margin-top:-6px; border-right:2px solid var(--acx-ink2); border-bottom:2px solid var(--acx-ink2); transform:rotate(45deg); pointer-events:none}
#acx-s2 select{appearance:none; -webkit-appearance:none; width:100%; min-height:44px; padding:0 36px 0 12px; border:1px solid var(--acx-line2); border-radius:10px; background:var(--acx-bg2); color:var(--acx-ink); font:inherit; font-size:15px; font-weight:500; cursor:pointer}
#acx-s2 select:focus-visible{outline:2px solid var(--acx-accent); outline-offset:2px}
#acx-s2 .s2-split{grid-template-columns:minmax(0,1fr)}
@media (min-width:1400px){ #acx-s2 .s2-split{grid-template-columns:minmax(0,1fr) 320px} }
#acx-s2 .s2-main{padding:14px 16px 16px; display:flex; flex-direction:column; gap:12px; min-width:0; align-self:start}
#acx-s2 .s2-top{display:flex; flex-wrap:wrap; align-items:center; gap:10px}
#acx-s2 .s2-read{min-height:44px; font-size:15px; line-height:1.45; color:var(--acx-ink2); text-wrap:balance}
#acx-s2 .s2-read b{color:var(--acx-ink); font-weight:600}
#acx-s2 .s2-read .s2-rt{font-family:var(--acx-mono); font-size:14px; color:var(--acx-ink3)}

/* matrix */
#acx-s2 .s2-scroll{overflow-x:auto; overscroll-behavior-x:contain}
#acx-s2 .s2-mx{--nc:150px; display:grid; grid-template-columns:var(--nc) repeat(var(--k,6), minmax(92px,1fr)); min-width:calc(var(--nc) + var(--k,6) * 92px)}

#acx-s2 .s2-hd:hover, #acx-s2 .s2-hd.is-on{color:var(--acx-accent)}
#acx-s2 .s2-hd:focus-visible{outline:2px solid var(--acx-accent); outline-offset:-2px}
#acx-s2 .s2-corner{border-bottom:1px solid var(--acx-line2)}
#acx-s2 .s2-pn{display:flex; align-items:center; min-height:32px; padding:4px 8px 4px 4px; font-size:15px; font-weight:600; line-height:1.15; color:var(--acx-ink); border-bottom:1px solid var(--acx-line)}

#acx-s2 .s2-c i, #acx-s2 .s2-k i{position:relative; display:block; width:14px; height:14px; border-radius:4px; box-sizing:border-box; transition:transform .15s ease}

#acx-s2 .s2-tile[aria-pressed="true"]{border-color:var(--acx-accent); box-shadow:inset 0 0 0 1px var(--acx-accent)}
#acx-s2 .s2-tn{font-size:14px; line-height:1.25; font-weight:600; color:var(--acx-ink); text-wrap:balance}

/* decision tree */
#acx-s2 .s2-tree{position:relative; display:grid; grid-template-columns:repeat(var(--tc,3), minmax(0,1fr)); column-gap:40px; row-gap:16px; align-items:center}
#acx-s2 .s2-wires{position:absolute; inset:0; width:100%; height:100%; overflow:visible; pointer-events:none}
#acx-s2 .s2-wires path{fill:none; stroke:var(--acx-line2); stroke-width:1.5}
#acx-s2 .s2-wires path.is-on{stroke:var(--acx-accent); stroke-width:2.5}

#acx-s2 .s2-n{position:relative; z-index:1; display:block; min-height:42px; padding:10px 12px; text-wrap:balance; border:1px solid var(--acx-line2); border-radius:var(--acx-r-sm); background:var(--acx-panel); text-align:left; font-size:14px; line-height:1.3; color:var(--acx-ink2); text-decoration:none}
#acx-s2 .s2-n.is-q{color:var(--acx-ink)}
#acx-s2 .s2-n.is-leaf{border-style:solid; background:var(--acx-sunk); font-weight:600; color:var(--acx-ink); cursor:pointer}
#acx-s2 .s2-n.is-on{border-color:var(--acx-accent); box-shadow:inset 0 0 0 1px var(--acx-accent)}
#acx-s2 .s2-n.is-open{border-style:dashed; border-color:var(--acx-accent)}
#acx-s2 .s2-n.is-end{background:var(--acx-accent); border-color:var(--acx-accent); color:var(--acx-on-accent)}
#acx-s2 .s2-n.is-end .s2-br{color:var(--acx-on-accent)}
#acx-s2 .s2-br{font-family:var(--acx-mono); font-size:14px; font-weight:500; color:var(--acx-ink3); text-transform:uppercase; letter-spacing:.04em; margin-right:7px}
#acx-s2 .s2-ans{font-family:var(--acx-mono); font-size:14px; font-weight:500; color:var(--acx-accent); margin-left:7px; white-space:nowrap}
#acx-s2 .s2-crit{display:flex; flex-direction:column; gap:8px}
#acx-s2 .s2-gate{display:grid; grid-template-columns:18px minmax(0,1fr); gap:10px; align-items:start; padding-top:8px; border-top:1px solid var(--acx-line)}
#acx-s2 .s2-gate::before{content:""; width:16px; height:16px; margin-top:2px; border-radius:4px; border:2px solid var(--acx-pain); box-sizing:border-box}
#acx-s2 .s2-gate p{font-size:14px; line-height:1.4; color:var(--acx-ink2)}
#acx-s2 .s2-gate b{color:var(--acx-ink); font-weight:600}
#acx-s2 .s2-gate .s2-rt{font-family:var(--acx-mono); color:var(--acx-pain)}
#acx-s2 .s2-bar{display:flex; gap:2px; height:28px}
#acx-s2 .s2-seg{display:flex; align-items:center; padding:0 8px; min-width:0; border-radius:4px; background:var(--acx-accent2); color:var(--acx-on-accent); font-family:var(--acx-mono); font-size:14px; font-weight:600}
#acx-s2 .s2-seg:nth-child(even), #acx-s2 .s2-cl li:nth-child(even)::before{background:var(--acx-ink2)}
#acx-s2 .s2-seg:nth-child(even){color:var(--acx-bg)}
#acx-s2 .s2-cl{list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:4px 22px}
#acx-s2 .s2-cl li{display:grid; grid-template-columns:12px 1fr; gap:10px; align-items:start; font-size:14px; line-height:1.35; color:var(--acx-ink2)}
#acx-s2 .s2-cl li span{text-wrap:balance}
#acx-s2 .s2-cl li b{display:none; font-family:var(--acx-mono); font-weight:600; color:var(--acx-ink); margin-right:6px}
#acx-s2 .s2-cl li::before{content:""; width:12px; height:12px; margin-top:3px; border-radius:3px; background:var(--acx-accent2)}

/* side panel */
#acx-s2 .s2-side{padding:0; gap:16px; min-width:0}
#acx-s2 .s2-box{padding:16px 18px; display:flex; flex-direction:column; gap:10px}
#acx-s2 .s2-box h3{font-size:18px; line-height:1.2}
#acx-s2 .s2-fl{display:flex; flex-direction:column; gap:8px}
#acx-s2 .s2-fi{display:flex; align-items:flex-start; gap:10px}
#acx-s2 .s2-fi .acx-chip{flex:none; min-width:86px; justify-content:flex-start}
#acx-s2 .s2-fi p{font-size:15px; line-height:1.4; font-weight:600; color:var(--acx-ink); padding-top:1px}
#acx-s2 .s2-none{font-size:15px; color:var(--acx-ink2)}
#acx-s2 .s2-bl{display:flex; flex-direction:column; gap:2px}
#acx-s2 .s2-lg{display:flex; flex-direction:column}
#acx-s2 .s2-lr{display:flex; align-items:center; gap:10px; width:100%; min-height:42px; padding:3px 6px; border:0; border-radius:var(--acx-r-sm); background:none; cursor:pointer; text-align:left; font-size:14px; color:var(--acx-ink2)}
#acx-s2 .s2-lr:hover, #acx-s2 .s2-lr[aria-expanded="true"]{background:var(--acx-sunk)}
#acx-s2 .s2-lr:focus-visible{outline:2px solid var(--acx-accent); outline-offset:-2px}
#acx-s2 .s2-lr.is-empty{cursor:default; background:none; opacity:.5}
#acx-s2 .s2-ln{flex:1 1 auto; min-width:0; line-height:1.25}
#acx-s2 .s2-ln b{font-family:var(--acx-mono); font-weight:500; color:var(--acx-ink3)}
#acx-s2 .s2-dots{display:flex; flex-wrap:wrap; gap:4px; justify-content:flex-end; max-width:96px}
#acx-s2 .s2-dots i{display:block; width:10px; height:10px; border-radius:50%; background:var(--acx-accent)}
#acx-s2 .s2-li{display:flex; flex-direction:column; gap:2px; padding:4px 0 8px 22px}
#acx-s2 .s2-bi{display:block; width:100%; min-height:42px; padding:4px 0 4px 12px; border:0; border-left:2px solid var(--acx-line2); background:none; cursor:pointer; text-align:left; font-size:14px; line-height:1.35; color:var(--acx-ink); text-wrap:balance}
#acx-s2 .s2-bi:hover, #acx-s2 .s2-bi[aria-expanded="true"]{border-left-color:var(--acx-accent)}
#acx-s2 .s2-bi:focus-visible{outline:2px solid var(--acx-accent); outline-offset:2px}
#acx-s2 .s2-why{display:block; margin-top:4px; font-size:14px; color:var(--acx-ink2)}
#acx-s2 .s2-out{align-self:flex-start}

@media (min-width:700px) and (max-width:1399px){
  #acx-s2 .s2-side{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.4fr); gap:0 30px; padding:16px 20px; background:var(--acx-panel); border:1px solid var(--acx-line); border-radius:var(--acx-r); box-shadow:var(--acx-shadow)}
  #acx-s2 .s2-box{background:transparent; border:0; box-shadow:none; padding:0; border-radius:0}
  #acx-s2 .s2-build{padding-left:30px; margin-left:-1px; border-left:1px solid var(--acx-line)}

  #acx-s2 .s2-cfg{grid-template-columns:minmax(0,1fr); gap:8px; padding:12px 14px}

  #acx-s2 .acx-seg button{padding:0 12px}

<script>ACX.scene('s2', function (el, A) {
  'use strict';
  var D = A.data || {}, esc = A.esc;
  var CFG = D.configurator || {}, IN = CFG.inputs || [], RULES = CFG.build || [];
  var P = D.protocols || [], PAR = D.params || [], L = D.layers || [], PAT = D.patterns || [];
  var TREE = D.tree || [], CRIT = D.criteria || [], COMP = (D.arch && D.arch.components) || [], VARS = D.vars || [];
  var PM = {}, LM = {}, PATM = {}, TM = {};
  PAR.forEach(function (x) { PM[x.id] = x; }); L.forEach(function (x, i) { LM[x.id] = x; x._i = i; });
  PAT.forEach(function (x) { PATM[x.id] = x; }); TREE.forEach(function (x) { TM[x.id] = x; });
  var RANK = { Live: 0, Pilot: 1, Spec: 2, Unsettled: 3, Absent: 4 };
  var VIEWS = [{ id: 'matrix', name: 'Matrix' }, { id: 'arch', name: 'Architecture' }, { id: 'tree', name: 'Decision tree' }];
  var used = {}; P.forEach(function (p) { Object.keys(p.params || {}).forEach(function (k) { used[k] = 1; }); });
  var COLS = {
    leader: ['P1', 'P3', 'P4', 'P6', 'P7', 'P9'].filter(function (k) { return PM[k] && used[k]; }),
    architect: ['P3', 'P4', 'P5', 'P6', 'P11', 'P12'].filter(function (k) { return PM[k] && used[k]; })
  };
  var $ = function (s) { return el.querySelector(s); };
  var readEl = $('.s2-read');

  /* ---------- configuration in the hash: the five values joined by dots, in input order */
  function parseCfg(s) {
    var parts = String(s || '').split('.'), o = {};
    IN.forEach(function (inp, i) {
      var opts = inp.options || [];
      o[inp.id] = opts.some(function (x) { return x.v === parts[i]; }) ? parts[i] : (opts[0] && opts[0].v);
    });
    return o;
  }
  function cfgStr(o) { return IN.map(function (inp) { return o[inp.id]; }).join('.'); }
  var st = { cfg: parseCfg(A.get('cfg')), view: VIEWS.some(function (v) { return v.id === A.get('view'); }) ? A.get('view') : 'matrix', read: null, comp: COMP[0] && COMP[0].id, open: null };
